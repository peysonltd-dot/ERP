    if (!firebase.apps.length) {

    // --- SHOPLINE 分類母資料與商品欄位常數 ---
    const SHOPLINE_ROOT_CATEGORY = "所有禮品";
    const CATEGORY_SETTINGS_DOC = "productCategories";
    const categoryNode = (id, name, children = [], active = true, aliases = []) => ({

    const DEFAULT_CATEGORY_CATALOG = [

        categoryNode("travel-adapter", "旅行插頭"),

      ]),
      categoryNode("home", "家居用品", [

      ]),

      ]),
      categoryNode("apparel", "服飾", [

      ]),
      categoryNode("esg", "ESG環保禮品"),
      categoryNode("golf", "高爾夫專區", [], false),
      categoryNode("packaging", "禮物包裝", [], false)
    ];
    const normalizeCategoryCatalog = (value) => {
      const input = Array.isArray(value) && value.length > 0 ? value : DEFAULT_CATEGORY_CATALOG;
      return input.map((main, mainIndex) => ({
        id: String(main.id || `main-${mainIndex + 1}`),
        name: String(main.name || '').trim(),
        shoplineName: String(main.shoplineName || main.name || '').trim(),
        active: main.active !== false,
        aliases: Array.isArray(main.aliases) ? main.aliases.map(String).filter(Boolean) : [],
        children: (Array.isArray(main.children) ? main.children : []).map((sub, subIndex) => ({
          id: String(sub.id || `sub-${mainIndex + 1}-${subIndex + 1}`),
          name: String(sub.name || '').trim(),
          shoplineName: String(sub.shoplineName || sub.name || '').trim(),
          active: sub.active !== false,
          aliases: Array.isArray(sub.aliases) ? sub.aliases.map(String).filter(Boolean) : [],
          children: []
        }))
      })).filter(main => main.name);
    };
    const nodeMatches = (node, value) => {
      const target = String(value || '').trim();
      return Boolean(target) && [node.name, node.shoplineName, ...(node.aliases || [])].includes(target);
    };
    const findMainCategory = (catalog, value) => normalizeCategoryCatalog(catalog).find(main => nodeMatches(main, value));
    const findSubCategory = (main, value) => (main?.children || []).find(sub => nodeMatches(sub, value));
    const buildCategoryTree = (catalog, includeInactive = false) => Object.fromEntries(
      normalizeCategoryCatalog(catalog)
        .filter(main => includeInactive || main.active)
        .map(main => [
          main.name,
          main.children.filter(sub => includeInactive || sub.active).map(sub => sub.name)
        ])
    );
    const makeCategoryId = (prefix) => `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    const categoryTree = buildCategoryTree(DEFAULT_CATEGORY_CATALOG);
    const customizationOptions = ["彩色印刷", "單色印刷", "壓印燙金", "壓印", "雷射雕刻"];
    const customizationDisplayOrder = ["雷射雕刻", "單色印刷", "彩色印刷", "壓印燙金", "壓印"];
    const customizationLabelsZh = {
      "雷射雕刻": "雷雕",
      "單色印刷": "單色印刷",
      "彩色印刷": "彩色印刷",
      "壓印燙金": "壓印燙金",
      "壓印": "壓印"
    };
    const customizationLabelsEn = {
      "雷射雕刻": "Laser Engraving",
      "單色印刷": "Single-Color Printing",
      "彩色印刷": "Full-Color Printing",
      "壓印燙金": "Foil Stamping",
      "壓印": "Debossing"
    };
    const BACKEND_URL = "https://erpbackend-zqgg.onrender.com";
    const ERP_VERSION = "2.6.0";
    const MAX_MAIN_IMAGES = 12;
    const MAX_ADDITIONAL_IMAGES = 20;

    const shoplineHeadersEn = [
      "Product Handle*", "Product Name(English)*", "Product Name(Chinese)*", "Product Summary(English)", "Product Summary(Chinese)",
      "Product Description(English)", "Product Description(Chinese)", "SEO Title(English)", "SEO Title(Chinese)",
      "SEO Description(English)", "SEO Description(Chinese)", "SEO Keywords", "Preorder Feature", "Preorder Note(English)",
      "Preorder Note(Chinese)", "Unlimited Preorder Supply", "Preorder Limit", "Online Store Status",
      "Max.12 images for each product (If the Variant Image App is installed, up to 300 main images are supported. Please note that the total character count for all image links must not exceed the Excel cell limit.)*",
      "Additional Images", "Online Store Categories(English)", "Online Store Categories(Chinese)", "Price", "Sales Price", "Cost", "SKU",
      "Member Price", "Quantity", "Weight(KG)", "Product Tag", "Hidden Product", "Exclude Payment Options", "Exclude Delivery Options",
      "Specification Name A(English)", "Specification Name A(Chinese)", "Specification Name B(English)", "Specification Name B(Chinese)",
      "Variation Image", "Variation name A(English)", "Variation name A(Chinese)", "Variation name B(English)",
      "Variation name B(Chinese)", "Variation quantity", "Variation price", "Variant Sale Price", "Variant Member Price",
      "Variant Cost", "Variation SKU", "Variant Weight(KG)", "Barcode"
    ];

    const shoplineHeadersZh = [
      "商品編號*", "商品名稱(英文)*", "商品名稱(繁體中文)*", "商品摘要(英文)", "商品摘要(繁體中文)", "商品描述(英文)",
      "商品描述(繁體中文)", "SEO標題(英文)", "SEO標題(繁體中文)", "SEO簡介(英文)", "SEO簡介(繁體中文)", "SEO關鍵字",
      "預購功能", "預購提示(英文)", "預購提示(繁體中文)", "預購商品可無限供貨", "預購上限", "網店上架狀態",
      "每件商品最多 12 張主要圖片（若有多款式商品圖片擴充功能，則最多 300 張主要圖片。請注意，所有圖片連結的總字數不可超過 Excel 儲存格限制）*",
      "更多相片 (每件產品最多20張主要圖片， Max.20 images for each product)", "網店分類(英文)", "網店分類(繁體中文)",
      "原價格", "特價", "成本價", "商品貨號", "商品會員價", "數量", "重量(KG)", "商品管理標籤", "隱藏商品",
      "排除的付款方式", "排除的送貨方式", "規格名稱1(英文)", "規格名稱1(繁體中文)", "規格名稱2(英文)",
      "規格名稱2(繁體中文)", "款式圖片 (每個款式最多 1 張款式圖片， Max.1 image for each variant)", "選項名稱A(英文)",
      "選項名稱A(繁體中文)", "選項名稱B(英文)", "選項名稱B(繁體中文)", "選項數量", "選項價格", "款式特價",
      "款式會員價", "款式成本", "選項商品貨號", "款式重量(KG)", "商品條碼編號"
    ];

    const serverTimestamp = () => firebase.firestore.FieldValue.serverTimestamp();
    const cloneData = (value) => JSON.parse(JSON.stringify(value || {}));
    const splitLines = (value) => String(value || '').split('\n').map(item => item.trim()).filter(Boolean);
    const splitComma = (value) => String(value || '').split(/[,，\n]/).map(item => item.trim()).filter(Boolean);
    const joinLines = (value) => Array.isArray(value) ? value.join('\n') : '';
    const normalizeUrlList = (value, legacyValue = '', maxItems = 20) => {
      const values = Array.isArray(value)
        ? value
        : String(value || legacyValue || '').split(/\s+/);
      return Array.from(new Set(values.map(item => String(item || '').trim()).filter(Boolean))).slice(0, maxItems);
    };
    const isValidShoplineImageUrl = (value) => /^https:\/\/[^\s\u3400-\u9fff]+$/i.test(String(value || '').trim());
    const categoryPath = (main, sub, catalog = DEFAULT_CATEGORY_CATALOG) => {
      const mainNode = findMainCategory(catalog, main);
      const subNode = findSubCategory(mainNode, sub);
      return [
        SHOPLINE_ROOT_CATEGORY,
        mainNode?.shoplineName || main,
        subNode?.shoplineName || sub
      ].filter(Boolean).join('>');
    };
    const parseCategoryParts = (rawValue, catalog = DEFAULT_CATEGORY_CATALOG) => {
      const parts = String(rawValue || '').split('>').map(item => item.trim()).filter(Boolean);
      if (parts[0] === SHOPLINE_ROOT_CATEGORY) parts.shift();
      const mainNode = findMainCategory(catalog, parts[0]);
      const subNode = findSubCategory(mainNode, parts[1]);
      return {
        main: mainNode?.name || parts[0] || '',
        sub: subNode?.name || parts[1] || ''
      };
    };
    const isValidCategory = (main, sub, catalog = DEFAULT_CATEGORY_CATALOG) => {
      const mainNode = findMainCategory(catalog, main);
      if (!mainNode) return false;
      const children = mainNode.children || [];
      return children.length === 0 ? !sub : Boolean(findSubCategory(mainNode, sub));
    };
    const stripOnsiteCopy = (value, language) => {
      const patterns = language === 'en'
        ? [
            /On-site event (?:personalization|customization) is available for this product\.[^\n]*/gi,
            /This product (?:is available for|supports) on-site event (?:personalization|customization)\.[^\n]*/gi
          ]
        : [
            /[※◆]?\s*(?:此|本)商品可提供活動現場客製服務[^\n。]*[。]?/g,
            /[※◆]?\s*(?:此|本)商品支援活動現場客製(?:化)?服務[^\n。]*[。]?/g
          ];
      return patterns.reduce((text, pattern) => text.replace(pattern, ''), String(value || ''))
      .replace(/\n{3,}/g, '\n\n')
      .trim();
    };
    const normalizeCustomizationCrafts = (...values) => {
      const raw = values.flatMap(value => Array.isArray(value) ? value : [value]).filter(Boolean).join('、');
      const matched = customizationOptions.filter(option => {
        if (raw.includes(option)) return true;
        if (option === '彩色印刷') return /UV|彩色/.test(raw);
        if (option === '單色印刷') return /網版|單色/.test(raw);
        if (option === '壓印燙金') return /燙金|燙銀/.test(raw);
        if (option === '壓印') return /(?:^|[、,，/\s])壓印(?:$|[、,，/\s])/.test(raw);
        if (option === '雷射雕刻') return /雷射|雷雕/.test(raw);
        return false;
      });
      return matched.length > 0 ? matched : ['雷射雕刻'];
    };
    const stripManagedHighlights = (items, language) => {
      const managedPattern = language === 'en'
        ? /^(?:customization|customisation|printing|decoration)\s+(?:techniques?|methods?|crafts?)\s*[:：]|^(?:available\s+for\s+)?on-site\s+event\s+(?:customization|customisation|personalization|laser\s+engraving)/i
        : /^(?:印製工藝|印刷工藝|客製工藝|客製方式)\s*[:：]|^可在活動現場客製化|^(?:此|本)商品(?:可提供|支援)活動現場客製/;
      return (Array.isArray(items) ? items : splitLines(items))
        .map(item => String(item || '').replace(/^[・•◆※\-]\s*/, '').trim())
        .filter(item => item && !managedPattern.test(item));
    };
    const applyCustomizationHighlights = (items, crafts, onsiteCustomization, language) => {
      const normalizedCrafts = customizationDisplayOrder.filter(craft => crafts.includes(craft));
      const cleaned = stripManagedHighlights(items, language);
      if (normalizedCrafts.length === 0) return cleaned;

      const labels = language === 'en' ? customizationLabelsEn : customizationLabelsZh;
      const craftText = normalizedCrafts.map(craft => labels[craft]).join(language === 'en' ? ', ' : '、');
      const techniqueLine = language === 'en'
        ? `Customization Techniques: ${craftText}`
        : `印製工藝：${craftText}`;
      const onsiteLine = language === 'en'
        ? 'On-site event laser engraving is available'
        : '可在活動現場客製化雷雕';

      return [...cleaned, techniqueLine, ...(onsiteCustomization === 'Y' ? [onsiteLine] : [])];
    };
    const buildProductHandle = (product = {}) => {
      const data = product.finalData || product.aiResult || {};
      const existing = data.product_handle || product.productHandle;
      if (existing) return String(existing).trim();
      const safeId = String(product.id || '').replace(/[^a-zA-Z0-9]/g, '').slice(0, 12).toUpperCase();
      return safeId ? `PEY-${safeId}` : '';
    };

    const buildSummary = (items) => (Array.isArray(items) ? items : [])
      .map(item => String(item || '').replace(/^[・•\-]\s*/, '').trim())
      .filter(Boolean)
      .map(item => `・${item}`)
      .join('\n\n');

    const getShoplineCategory = (product = {}, data = {}, catalog = DEFAULT_CATEGORY_CATALOG) => {
      const { main, sub } = getCategoryParts(product, data, catalog);
      return isValidCategory(main, sub, catalog) ? categoryPath(main, sub, catalog) : '';
    };

    const getExportIssues = (product = {}, catalog = DEFAULT_CATEGORY_CATALOG) => {
      const data = getWorkingData(product);
      const issues = [];
      const handle = buildProductHandle(product);
      const category = getShoplineCategory(product, data, catalog);
      const mainImageUrls = normalizeUrlList(data.main_image_urls, data.main_image_url, Number.MAX_SAFE_INTEGER);
      const additionalImageUrls = normalizeUrlList(data.additional_image_urls, data.additional_images, Number.MAX_SAFE_INTEGER);
      const crafts = normalizeCustomizationCrafts(
        data.customization_crafts,
        data.customization_craft,
        data.requested_customization,
        product.customOptionList,
        product.customizationCraft,
        product.customOptions
      );
      const onsiteCustomization = data.onsite_customization || product.onsiteCustomization || 'N';
      const summaryZh = buildSummary(applyCustomizationHighlights(data.product_highlights_zh, crafts, onsiteCustomization, 'zh'));
      const summaryEn = buildSummary(applyCustomizationHighlights(data.product_highlights_en, crafts, onsiteCustomization, 'en'));

      if (product.archived) issues.push('商品已封存');
      if (!product.finalData) issues.push('尚未保存人工確認版本');
      if (!handle) issues.push('缺少商品編號');
      if (!String(data.title_zh || '').trim() && !String(data.title_en || '').trim()) issues.push('缺少商品名稱');
      if (!category) issues.push('分類名稱或層級不符合 SHOPLINE 官網');
      if (mainImageUrls.length === 0) {
        issues.push('缺少商品主圖網址');
      }
      if (mainImageUrls.some(url => !isValidShoplineImageUrl(url))) issues.push('商品主圖網址格式不正確');
      if (additionalImageUrls.some(url => !isValidShoplineImageUrl(url))) issues.push('更多圖片網址格式不正確');
      if (mainImageUrls.length > MAX_MAIN_IMAGES) issues.push(`商品主圖超過 ${MAX_MAIN_IMAGES} 張`);
      if (additionalImageUrls.length > MAX_ADDITIONAL_IMAGES) issues.push(`更多圖片超過 ${MAX_ADDITIONAL_IMAGES} 張`);
      if (summaryZh.length > 300) issues.push('繁中商品摘要超過 300 字');
      if (summaryEn.length > 300) issues.push('英文商品摘要超過 300 字');
      return issues;
    };

    const buildShoplineRow = (product = {}, catalog = DEFAULT_CATEGORY_CATALOG) => {
      const data = getWorkingData(product);
      const crafts = normalizeCustomizationCrafts(
        data.customization_crafts,
        data.customization_craft,
        data.requested_customization,
        product.customOptionList,
        product.customizationCraft,
        product.customOptions
      );
      const onsiteCustomization = data.onsite_customization || product.onsiteCustomization || 'N';
      const row = Array(shoplineHeadersEn.length).fill('');
      row[0] = buildProductHandle(product);
      row[1] = String(data.title_en || '').trim();
      row[2] = String(data.title_zh || '').trim();
      row[3] = buildSummary(applyCustomizationHighlights(data.product_highlights_en, crafts, onsiteCustomization, 'en'));
      row[4] = buildSummary(applyCustomizationHighlights(data.product_highlights_zh, crafts, onsiteCustomization, 'zh'));
      row[5] = stripOnsiteCopy(data.description_en, 'en');
      row[6] = stripOnsiteCopy(data.description_zh, 'zh');
      row[7] = String(data.seo_title_en || '').trim();
      row[8] = String(data.seo_title_zh || '').trim();
      row[9] = String(data.seo_description_en || '').trim();
      row[10] = String(data.seo_description_zh || '').trim();
      row[11] = Array.isArray(data.seo_keywords) ? data.seo_keywords.join(',') : String(data.seo_keywords || '').trim();
      row[12] = 'N';
      row[17] = data.online_store_status === 'N' ? 'N' : 'Y';
      row[18] = normalizeUrlList(data.main_image_urls, data.main_image_url, MAX_MAIN_IMAGES).join(' ');
      row[19] = normalizeUrlList(data.additional_image_urls, data.additional_images, MAX_ADDITIONAL_IMAGES).join(' ');
      row[21] = getShoplineCategory(product, data, catalog);
      row[25] = String(data.sku || '').trim();
      row[30] = 'N';
      return row;
    };

    const exportFilename = () => {
      const now = new Date();
      const stamp = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, '0'),
        String(now.getDate()).padStart(2, '0'),
        '-',
        String(now.getHours()).padStart(2, '0'),
        String(now.getMinutes()).padStart(2, '0')
      ].join('');
      return `Peyson-SHOPLINE-${stamp}.xlsx`;
    };

    const getCategoryParts = (product = {}, productData = {}, catalog = DEFAULT_CATEGORY_CATALOG) => {
      if (product.categoryMain) {
        const mainNode = findMainCategory(catalog, product.categoryMain);
        const subNode = findSubCategory(mainNode, product.categorySub || '');
        return {
          main: mainNode?.name || product.categoryMain,
          sub: subNode?.name || product.categorySub || ''
        };
      }

      const raw = product.categoryPath || productData.category || product.category || '';
      if (raw.includes('>')) return parseCategoryParts(raw, catalog);
      const [main = '', sub = ''] = String(raw).split(' - ').map(item => item.trim());
      return parseCategoryParts([SHOPLINE_ROOT_CATEGORY, main, sub].filter(Boolean).join('>'), catalog);
    };

    const getWorkingData = (product = {}) => cloneData(product.finalData || product.aiResult || {});

    const formatDate = (timestamp) => {
      if (!timestamp) return '—';
      const date = typeof timestamp.toDate === 'function' ? timestamp.toDate() : new Date(timestamp);
      return Number.isNaN(date.getTime()) ? '—' : date.toLocaleString('zh-TW', { hour12: false });
    };

    const getProductState = (product = {}) => {
      if (product.archived) return { key: 'archived', label: '已封存', className: 'bg-gray-100 text-gray-600' };
      if (product.status === 'pending') return { key: 'processing', label: '排隊中', className: 'bg-amber-50 text-amber-700' };
      if (product.status === 'processing') return { key: 'processing', label: 'AI 處理中', className: 'bg-blue-50 text-blue-700' };
      if (product.status === 'error') return { key: 'error', label: '處理失敗', className: 'bg-red-50 text-red-700' };
      if (product.finalData) return { key: 'saved', label: '已儲存', className: 'bg-green-50 text-green-700' };
      if (product.aiResult) return { key: 'review', label: '待確認', className: 'bg-violet-50 text-violet-700' };
      return { key: 'unknown', label: '資料不完整', className: 'bg-gray-100 text-gray-600' };
    };

    // ==========================================
    // 元件 1：Firebase 安全登入畫面
    // ==========================================
    const SimpleLogin = () => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setIsLoading(true);
        try {
          // 呼叫 Firebase 進行真實登入驗證
          await auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
          console.error("登入失敗:", err);
          setError('登入失敗：帳號或密碼錯誤。');
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
          <div className="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 w-full max-w-md animate-in fade-in zoom-in duration-300">
            <div className="text-center mb-8">
              <div className="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <Shield className="w-8 h-8 text-white" />
              </div>
              <h1 className="text-2xl font-bold tracking-wider text-gray-900">PEYSON<span className="text-blue-500">.ERP</span></h1>
              <p className="text-gray-500 text-sm mt-2">系統已啟用 Firebase 安全加密</p>
            </div>
            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">企業信箱帳號</label>
                <div className="relative">
                  <User className="w-5 h-5 absolute left-3 top-2.5 text-gray-400" />
                  <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="例如：admin@peyson.com" />
                </div>
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">登入密碼</label>
                <div className="relative">
                  <Lock className="w-5 h-5 absolute left-3 top-2.5 text-gray-400" />
                  <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="請輸入密碼" />
                </div>
              </div>
              {error && <div className="p-3 bg-red-50 text-red-600 text-sm rounded-lg flex items-center gap-2"><AlertCircle className="w-4 h-4 shrink-0"/> {error}</div>}
              <button type="submit" disabled={isLoading} className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-md transition-all flex justify-center items-center gap-2 disabled:bg-gray-400">
                {isLoading ? <Loader2 className="w-5 h-5 animate-spin" /> : '安全登入系統'}
              </button>
            </form>
          </div>
        </div>
      );
    };

    // ==========================================
    // 元件 2：商品分類管理
    // ==========================================
    const CategoryManagementView = ({ catalog, onSave }) => {
      const normalizedCatalog = normalizeCategoryCatalog(catalog);
      const [products, setProducts] = useState([]);
      const [editor, setEditor] = useState(null);
      const [isSaving, setIsSaving] = useState(false);
      const [message, setMessage] = useState('');
      const [error, setError] = useState('');

      useEffect(() => {
        const unsubscribe = db.collection('products').onSnapshot((snapshot) => {
          setProducts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        }, (snapshotError) => {
          setError(`商品使用狀態讀取失敗：${snapshotError.message}`);
        });
        return () => unsubscribe();
      }, []);

      const usageCount = (main, sub = null) => products.filter(product => {
        const parts = getCategoryParts(product, getWorkingData(product), normalizedCatalog);
        if (parts.main !== main.name) return false;
        return sub ? parts.sub === sub.name : true;
      }).length;

      const persist = async (nextCatalog, successText) => {
        setIsSaving(true);
        setError('');
        setMessage('');
        try {
          await onSave(normalizeCategoryCatalog(nextCatalog));
          setMessage(`✅ ${successText}`);
        } catch (saveError) {
          setError(`分類儲存失敗：${saveError.message}`);
          throw saveError;
        } finally {
          setIsSaving(false);
        }
      };

      const migrateProductReferences = async ({
        oldMainName,
        oldSubName = '',
        newMainName,
        newSubName = '',
        nextCatalog
      }) => {
        const affected = products.filter(product => {
          const parts = getCategoryParts(product, getWorkingData(product), normalizedCatalog);
          return parts.main === oldMainName && (!oldSubName || parts.sub === oldSubName);
        });

        for (let start = 0; start < affected.length; start += 400) {
          const batch = db.batch();
          affected.slice(start, start + 400).forEach(product => {
            const currentData = getWorkingData(product);
            const currentParts = getCategoryParts(product, currentData, normalizedCatalog);
            const nextMain = newMainName;
            const nextSub = oldSubName ? newSubName : currentParts.sub;
            const nextPath = categoryPath(nextMain, nextSub, nextCatalog);
            const updateData = {
              categoryMain: nextMain,
              categorySub: nextSub,
              categoryPath: nextPath,
              category: nextPath,
              updatedAt: serverTimestamp()
            };
            if (product.finalData) {
              updateData.finalData = { ...cloneData(product.finalData), category: nextPath };
            }
            batch.update(db.collection('products').doc(product.id), updateData);
          });
          await batch.commit();
        }
        return affected.length;
      };

      const openAddMain = () => setEditor({
        type: 'main',
        mode: 'add',
        mainId: '',
        subId: '',
        name: '',
        shoplineName: '',
        active: true,
        shoplineManuallyEdited: false
      });
      const openAddSub = (main) => setEditor({
        type: 'sub',
        mode: 'add',
        mainId: main.id,
        subId: '',
        name: '',
        shoplineName: '',
        active: true,
        shoplineManuallyEdited: false
      });
      const openEdit = (type, main, sub = null) => {
        const target = sub || main;
        setEditor({
          type,
          mode: 'edit',
          mainId: main.id,
          subId: sub?.id || '',
          name: target.name,
          shoplineName: target.shoplineName || target.name,
          active: target.active !== false,
          shoplineManuallyEdited: true
        });
      };

      const handleEditorSave = async () => {
        const name = String(editor?.name || '').trim();
        const shoplineName = String(editor?.shoplineName || name).trim();
        if (!name || !shoplineName) {
          return setError('分類名稱與 SHOPLINE 對應名稱皆不可空白。');
        }

        const nextCatalog = cloneData(normalizedCatalog);
        let migration = null;

        if (editor.type === 'main') {
          const duplicate = nextCatalog.some(item =>
            item.id !== editor.mainId && item.name.toLowerCase() === name.toLowerCase()
          );
          if (duplicate) return setError('已有相同的第二層分類名稱。');
          const duplicateShopline = nextCatalog.some(item =>
            item.id !== editor.mainId && String(item.shoplineName || '').toLowerCase() === shoplineName.toLowerCase()
          );
          if (duplicateShopline) return setError('已有相同的第二層 SHOPLINE 對應名稱。');

          if (editor.mode === 'add') {
            nextCatalog.push(categoryNode(makeCategoryId('main'), name, [], editor.active));
            nextCatalog[nextCatalog.length - 1].shoplineName = shoplineName;
          } else {
            const main = nextCatalog.find(item => item.id === editor.mainId);
            const oldMainName = main.name;
            const oldShoplineName = main.shoplineName;
            if (oldMainName !== name || oldShoplineName !== shoplineName) {
              main.aliases = Array.from(new Set([...(main.aliases || []), oldMainName, oldShoplineName].filter(Boolean)));
              migration = {
                oldMainName,
                newMainName: name,
                nextCatalog
              };
            }
            main.name = name;
            main.shoplineName = shoplineName;
            main.active = editor.active;
          }
        } else {
          const main = nextCatalog.find(item => item.id === editor.mainId);
          const duplicate = main.children.some(item =>
            item.id !== editor.subId && item.name.toLowerCase() === name.toLowerCase()
          );
          if (duplicate) return setError('此分類下已有相同的第三層分類名稱。');
          const duplicateShopline = main.children.some(item =>
            item.id !== editor.subId && String(item.shoplineName || '').toLowerCase() === shoplineName.toLowerCase()
          );
          if (duplicateShopline) return setError('此分類下已有相同的第三層 SHOPLINE 對應名稱。');

          if (editor.mode === 'add') {
            main.children.push(categoryNode(makeCategoryId('sub'), name, [], editor.active));
            main.children[main.children.length - 1].shoplineName = shoplineName;
          } else {
            const sub = main.children.find(item => item.id === editor.subId);
            const oldSubName = sub.name;
            const oldShoplineName = sub.shoplineName;
            if (oldSubName !== name || oldShoplineName !== shoplineName) {
              sub.aliases = Array.from(new Set([...(sub.aliases || []), oldSubName, oldShoplineName].filter(Boolean)));
              migration = {
                oldMainName: main.name,
                oldSubName,
                newMainName: main.name,
                newSubName: name,
                nextCatalog
              };
            }
            sub.name = name;
            sub.shoplineName = shoplineName;
            sub.active = editor.active;
          }
        }

        let catalogSaved = false;
        try {
          await persist(nextCatalog, editor.mode === 'add' ? '分類已新增。' : '分類已更新。');
          catalogSaved = true;
          let migratedCount = 0;
          if (migration) {
            migration.nextCatalog = nextCatalog;
            migratedCount = await migrateProductReferences(migration);
          }
          setEditor(null);
          if (migratedCount > 0) {
            setMessage(`✅ 分類已更新，並同步 ${migratedCount} 筆既有商品。`);
          }
        } catch (saveError) {
          if (catalogSaved) {
            setError(`分類已儲存並保留舊名稱相容性，但既有商品同步未完成：${saveError.message}`);
          }
        }
      };

      const toggleActive = async (main, sub = null) => {
        const nextCatalog = cloneData(normalizedCatalog);
        const nextMain = nextCatalog.find(item => item.id === main.id);
        const target = sub
          ? nextMain.children.find(item => item.id === sub.id)
          : nextMain;
        target.active = !target.active;
        try {
          await persist(nextCatalog, `${target.name}已${target.active ? '啟用' : '停用'}。`);
        } catch {
          // persist 已顯示錯誤。
        }
      };

      const moveItem = async (main, sub, direction) => {
        const nextCatalog = cloneData(normalizedCatalog);
        const list = sub
          ? nextCatalog.find(item => item.id === main.id).children
          : nextCatalog;
        const targetId = sub?.id || main.id;
        const index = list.findIndex(item => item.id === targetId);
        const nextIndex = index + direction;
        if (index < 0 || nextIndex < 0 || nextIndex >= list.length) return;
        [list[index], list[nextIndex]] = [list[nextIndex], list[index]];
        try {
          await persist(nextCatalog, '分類排序已更新。');
        } catch {
          // persist 已顯示錯誤。
        }
      };

      const deleteItem = async (main, sub = null) => {
        const used = usageCount(main, sub);
        if (used > 0) {
          return setError(`「${sub?.name || main.name}」已有 ${used} 筆商品使用，不可刪除；請改用停用。`);
        }
        if (!window.confirm(`確定永久刪除分類「${sub?.name || main.name}」嗎？`)) return;

        const nextCatalog = cloneData(normalizedCatalog);
        if (sub) {
          const nextMain = nextCatalog.find(item => item.id === main.id);
          nextMain.children = nextMain.children.filter(item => item.id !== sub.id);
        } else {
          const index = nextCatalog.findIndex(item => item.id === main.id);
          nextCatalog.splice(index, 1);
        }
        try {
          await persist(nextCatalog, '未使用分類已刪除。');
        } catch {
          // persist 已顯示錯誤。
        }
      };

      const actionButton = "p-2 rounded-lg border border-gray-200 text-gray-500 hover:text-blue-700 hover:bg-blue-50 disabled:opacity-30 disabled:cursor-not-allowed";

      return (
        <div className="p-8 max-w-[1400px] mx-auto animate-in fade-in duration-200">
          <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6">
            <div>
              <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                <FolderTree className="w-6 h-6 text-blue-600"/> 商品分類管理
              </h2>
              <p className="text-gray-500 text-sm mt-1">統一管理商品建置、商品編輯與 SHOPLINE 匯出的三級分類母資料。</p>
            </div>
            <button onClick={openAddMain} disabled={isSaving} className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-blue-600 text-white hover:bg-blue-700 disabled:bg-gray-300">
              <Plus className="w-4 h-4"/> 新增第二層分類
            </button>
          </div>

          {error && <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">{error}</div>}
          {message && <div className="mb-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm">{message}</div>}

          <div className="grid grid-cols-1 xl:grid-cols-[1fr_360px] gap-6">
            <section className="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
              <div className="px-5 py-4 border-b border-gray-200 bg-gray-50 flex items-center justify-between">
                <div>
                  <div className="font-bold text-gray-800">第一層：{SHOPLINE_ROOT_CATEGORY}</div>
                  <div className="text-xs text-gray-500 mt-1">共 {normalizedCatalog.length} 個第二層分類</div>
                </div>
                {isSaving && <Loader2 className="w-5 h-5 text-blue-600 animate-spin"/>}
              </div>

              <div className="divide-y divide-gray-100">
                {normalizedCatalog.map((main, mainIndex) => (
                  <div key={main.id} className={main.active ? '' : 'bg-gray-50'}>
                    <div className="px-5 py-4 flex flex-col lg:flex-row lg:items-center gap-3">
                      <div className="flex-1 min-w-0">
                        <div className="flex flex-wrap items-center gap-2">
                          <span className="font-bold text-gray-800">{main.name}</span>
                          <span className={`px-2 py-0.5 rounded-full text-[11px] font-medium ${main.active ? 'bg-green-50 text-green-700' : 'bg-gray-200 text-gray-500'}`}>
                            {main.active ? '啟用' : '停用'}
                          </span>
                          <span className="text-xs text-gray-400">{usageCount(main)} 筆商品</span>
                        </div>
                        <div className="text-xs text-gray-500 mt-1">SHOPLINE：{main.shoplineName}</div>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <button className={actionButton} title="上移" onClick={() => moveItem(main, null, -1)} disabled={isSaving || mainIndex === 0}><ArrowUp className="w-4 h-4"/></button>
                        <button className={actionButton} title="下移" onClick={() => moveItem(main, null, 1)} disabled={isSaving || mainIndex === normalizedCatalog.length - 1}><ArrowDown className="w-4 h-4"/></button>
                        <button className={actionButton} title="新增第三層分類" onClick={() => openAddSub(main)} disabled={isSaving}><Plus className="w-4 h-4"/></button>
                        <button className={actionButton} title="編輯" onClick={() => openEdit('main', main)} disabled={isSaving}><Pencil className="w-4 h-4"/></button>
                        <button className={actionButton} title={main.active ? '停用' : '啟用'} onClick={() => toggleActive(main)} disabled={isSaving}><Power className="w-4 h-4"/></button>
                        <button className={`${actionButton} hover:text-red-600 hover:bg-red-50`} title="刪除未使用分類" onClick={() => deleteItem(main)} disabled={isSaving}><Trash2 className="w-4 h-4"/></button>
                      </div>
                    </div>

                    {main.children.length > 0 && (
                      <div className="mx-5 mb-4 border border-gray-100 rounded-lg overflow-hidden">
                        {main.children.map((sub, subIndex) => (
                          <div key={sub.id} className={`px-4 py-3 flex flex-col md:flex-row md:items-center gap-3 border-b last:border-b-0 border-gray-100 ${sub.active ? 'bg-white' : 'bg-gray-50'}`}>
                            <div className="flex-1 min-w-0">
                              <div className="flex flex-wrap items-center gap-2">
                                <span className="text-sm font-medium text-gray-700">{sub.name}</span>
                                <span className={`px-2 py-0.5 rounded-full text-[10px] ${sub.active ? 'bg-green-50 text-green-700' : 'bg-gray-200 text-gray-500'}`}>{sub.active ? '啟用' : '停用'}</span>
                                <span className="text-[11px] text-gray-400">{usageCount(main, sub)} 筆</span>
                              </div>
                              <div className="text-[11px] text-gray-400 mt-1">SHOPLINE：{sub.shoplineName}</div>
                            </div>
                            <div className="flex items-center gap-1.5">
                              <button className={actionButton} title="上移" onClick={() => moveItem(main, sub, -1)} disabled={isSaving || subIndex === 0}><ArrowUp className="w-3.5 h-3.5"/></button>
                              <button className={actionButton} title="下移" onClick={() => moveItem(main, sub, 1)} disabled={isSaving || subIndex === main.children.length - 1}><ArrowDown className="w-3.5 h-3.5"/></button>
                              <button className={actionButton} title="編輯" onClick={() => openEdit('sub', main, sub)} disabled={isSaving}><Pencil className="w-3.5 h-3.5"/></button>
                              <button className={actionButton} title={sub.active ? '停用' : '啟用'} onClick={() => toggleActive(main, sub)} disabled={isSaving}><Power className="w-3.5 h-3.5"/></button>
                              <button className={`${actionButton} hover:text-red-600 hover:bg-red-50`} title="刪除未使用分類" onClick={() => deleteItem(main, sub)} disabled={isSaving}><Trash2 className="w-3.5 h-3.5"/></button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </section>

            <aside className="bg-white border border-gray-200 rounded-xl shadow-sm p-5 h-fit xl:sticky xl:top-6">
              {editor ? (
                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-gray-800">
                      {editor.mode === 'add' ? '新增' : '編輯'}{editor.type === 'main' ? '第二層' : '第三層'}分類
                    </h3>
                    <button onClick={() => setEditor(null)} className="p-1.5 rounded-lg text-gray-400 hover:bg-gray-100"><X className="w-4 h-4"/></button>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">ERP 顯示名稱</label>
                    <input value={editor.name} onChange={e => setEditor(current => ({ ...current, name: e.target.value, shoplineName: current.shoplineManuallyEdited ? current.shoplineName : e.target.value }))} className="w-full p-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"/>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">SHOPLINE 對應名稱</label>
                    <input value={editor.shoplineName} onChange={e => setEditor(current => ({ ...current, shoplineName: e.target.value, shoplineManuallyEdited: true }))} className="w-full p-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"/>
                    <p className="text-xs text-gray-400 mt-1.5">Excel 匯出時使用此名稱；應與官網分類完全一致。</p>
                  </div>
                  <label className="flex items-center gap-2 text-sm text-gray-700">
                    <input type="checkbox" checked={editor.active} onChange={e => setEditor(current => ({ ...current, active: e.target.checked }))} className="rounded border-gray-300 text-blue-600"/>
                    建立後立即啟用
                  </label>
                  <button onClick={handleEditorSave} disabled={isSaving} className="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-blue-600 text-white hover:bg-blue-700 disabled:bg-gray-300">
                    {isSaving ? <Loader2 className="w-4 h-4 animate-spin"/> : <Save className="w-4 h-4"/>} 儲存分類
                  </button>
                </div>
              ) : (
                <div>
                  <FolderTree className="w-10 h-10 text-blue-200 mb-3"/>
                  <h3 className="font-bold text-gray-800">分類管理規則</h3>
                  <ul className="mt-3 space-y-2 text-sm text-gray-500 list-disc pl-5">
                    <li>停用後不再出現在新商品的分類選單。</li>
                    <li>既有商品仍保留原分類與匯出能力。</li>
                    <li>已被商品使用的分類不可刪除，只能停用。</li>
                    <li>修改名稱時會同步更新既有商品分類路徑。</li>
                  </ul>
                </div>
              )}
            </aside>
          </div>
        </div>
      );
    };

    // ==========================================
    // 元件 3：商品建置中心
    // ==========================================
    const AIImportView = ({ onOpenLibrary, categoryCatalog }) => {
      const selectableCategoryTree = buildCategoryTree(categoryCatalog);
      const firstMainCategory = Object.keys(selectableCategoryTree)[0] || '';
      const [rawText, setRawText] = useState('');
      const [sourceUrl, setSourceUrl] = useState('');
      const [moq, setMoq] = useState(50);
      const [mainCategory, setMainCategory] = useState(firstMainCategory);
      const [subCategory, setSubCategory] = useState(selectableCategoryTree[firstMainCategory]?.[0] || '');
      const [customizationCrafts, setCustomizationCrafts] = useState(['雷射雕刻']);
      const [onsiteCustomization, setOnsiteCustomization] = useState('N');
      
      const [specImagesBase64, setSpecImagesBase64] = useState([]);
      const specInputRef = useRef(null);

      const [aiModel, setAiModel] = useState('gemini-3.6-flash');
      const [aiResult, setAiResult] = useState(null);
      const [aiDraft, setAiDraft] = useState(null);
      const [activeJobId, setActiveJobId] = useState('');
      const [jobStatus, setJobStatus] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [error, setError] = useState('');
      const [successMsg, setSuccessMsg] = useState('');

      useEffect(() => {
        if (!selectableCategoryTree[mainCategory]) {
          setMainCategory(firstMainCategory);
          setSubCategory(selectableCategoryTree[firstMainCategory]?.[0] || '');
        } else if (subCategory && !selectableCategoryTree[mainCategory].includes(subCategory)) {
          setSubCategory(selectableCategoryTree[mainCategory][0] || '');
        }
      }, [categoryCatalog]);

      const handleMainCategoryChange = (e) => {
        const selectedMain = e.target.value;
        setMainCategory(selectedMain);
        setSubCategory(selectableCategoryTree[selectedMain]?.[0] || '');
      };
      const toggleCustomizationCraft = (craft) => {
        const nextCrafts = customizationCrafts.includes(craft)
          ? customizationCrafts.filter(item => item !== craft)
          : [...customizationCrafts, craft];
        setCustomizationCrafts(nextCrafts);
        setAiResult(current => current
          ? {
              ...current,
              product_highlights_zh: applyCustomizationHighlights(current.product_highlights_zh, nextCrafts, onsiteCustomization, 'zh'),
              product_highlights_en: applyCustomizationHighlights(current.product_highlights_en, nextCrafts, onsiteCustomization, 'en')
            }
          : current);
      };
      const handleImportOnsiteCustomization = (value) => {
        setOnsiteCustomization(value);
        setAiResult(current => current
          ? {
              ...current,
              product_highlights_zh: applyCustomizationHighlights(current.product_highlights_zh, customizationCrafts, value, 'zh'),
              product_highlights_en: applyCustomizationHighlights(current.product_highlights_en, customizationCrafts, value, 'en'),
              description_zh: stripOnsiteCopy(current.description_zh, 'zh'),
              description_en: stripOnsiteCopy(current.description_en, 'en')
            }
          : current);
      };

      const handleSpecImageUpload = async (e) => {
        const selectedFiles = Array.from(e.target.files || []);
        if (selectedFiles.length > 5) setError('規格截圖最多上傳 5 張，已先取前 5 張。');
        const files = selectedFiles.slice(0, 5);
        const encoded = await Promise.all(files.map(file => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve({ name: file.name, mimeType: file.type, data: reader.result.split(',')[1] });
          reader.onerror = () => reject(new Error(`無法讀取圖片：${file.name}`));
          reader.readAsDataURL(file);
        })));
        setSpecImagesBase64(encoded);
      };

      useEffect(() => {
        if (!activeJobId) return undefined;

        const unsubscribe = db.collection('products').doc(activeJobId).onSnapshot((snapshot) => {
          if (!snapshot.exists) return;
          const docData = snapshot.data();
          setJobStatus(docData.status || '');

          if (docData.status === 'completed' && docData.aiResult) {
            const originalDraft = cloneData(docData.aiResult);
            const previewCrafts = normalizeCustomizationCrafts(
              docData.finalData?.customization_crafts,
              docData.customOptionList,
              docData.customizationCraft,
              docData.customOptions
            );
            const previewOnsite = docData.finalData?.onsite_customization || docData.onsiteCustomization || 'N';
            const normalizedResult = cloneData(docData.finalData || originalDraft);
            normalizedResult.product_highlights_zh = applyCustomizationHighlights(
              normalizedResult.product_highlights_zh,
              previewCrafts,
              previewOnsite,
              'zh'
            );
            normalizedResult.product_highlights_en = applyCustomizationHighlights(
              normalizedResult.product_highlights_en,
              previewCrafts,
              previewOnsite,
              'en'
            );
            normalizedResult.description_zh = stripOnsiteCopy(normalizedResult.description_zh, 'zh');
            normalizedResult.description_en = stripOnsiteCopy(normalizedResult.description_en, 'en');
            setAiDraft(originalDraft);
            setAiResult(normalizedResult);
            setIsGenerating(false);
            if (!docData.finalData) {
              setSuccessMsg(`✨ AI 處理完成：${docData.aiResult.title_zh}`);
            }
          }

          if (docData.status === 'error') {
            setIsGenerating(false);
            setError(`AI 處理失敗：${docData.errorMsg || '請稍後再試'}`);
          }
        }, (snapshotError) => {
          console.error("監聽商品失敗:", snapshotError);
          setIsGenerating(false);
          setError(`無法取得處理結果：${snapshotError.message}`);
        });

        return () => unsubscribe();
      }, [activeJobId]);

      const handleGenerate = async () => {
        if (!rawText.trim() && specImagesBase64.length === 0) return setError('請貼上文字說明或上傳規格圖片！');
        if (customizationCrafts.length === 0) return setError('請至少選擇一項客製工藝。');
        
        setError(''); setSuccessMsg(''); setIsGenerating(true); 

        try {
          let imageUrls = [];

          if (specImagesBase64.length > 0) {
            setSuccessMsg(`上傳 ${specImagesBase64.length} 張圖片至雲端...`);
            imageUrls = await Promise.all(specImagesBase64.map(async (image, index) => {
              const byteCharacters = atob(image.data);
              const byteNumbers = new Array(byteCharacters.length);
              for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
              }
              const byteArray = new Uint8Array(byteNumbers);
              const blob = new Blob([byteArray], { type: image.mimeType });
              const extension = image.mimeType.split('/')[1]?.replace('jpeg', 'jpg') || 'jpg';
              const fileName = `specs/${Date.now()}-${index + 1}.${extension}`;
              const storageRef = storage.ref().child(fileName);
              await storageRef.put(blob);
              return storageRef.getDownloadURL();
            }));
          }

          setSuccessMsg('建立雲端任務中...');

          const selectedCategoryPath = categoryPath(mainCategory, subCategory, categoryCatalog);
          const docRef = await db.collection('products').add({
            status: 'pending',
            catalogStatus: 'ai_processing',
            rawText: rawText,
            sourceUrl: sourceUrl.trim(),
            imageUrl: imageUrls[0] || null,
            sourceImages: imageUrls,
            moq: Number(moq) || 0,
            category: selectedCategoryPath,
            categoryMain: mainCategory,
            categorySub: subCategory,
            categoryPath: selectedCategoryPath,
            customOptions: customizationCrafts.join('、'),
            customOptionList: customizationCrafts,
            customizationCraft: customizationCrafts.join('、'),
            onsiteCustomization,
            aiModel: aiModel,
            createdBy: {
              uid: auth.currentUser?.uid || '',
              email: auth.currentUser?.email || ''
            },
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });

          setActiveJobId(docRef.id);
          setJobStatus('pending');
          setAiResult(null);
          setAiDraft(null);
          setRawText('');
          setSpecImagesBase64([]);
          if (specInputRef.current) specInputRef.current.value = '';
          setSuccessMsg('✅ 任務已送交雲端，正在等待 AI 完成。');

        } catch (err) {
          console.error("上傳失敗:", err);
          setError(`任務建立失敗: ${err.message}`);
          setIsGenerating(false);
        }
      };

      const handlePreviewChange = (field, val) => { setAiResult({ ...aiResult, [field]: val }); };

      const handleSave = async () => {
        if (!aiResult || !activeJobId) return;
        setIsSaving(true); setError(''); setSuccessMsg('');
        try {
          const finalData = {
            ...cloneData(aiResult),
            category: categoryPath(mainCategory, subCategory, categoryCatalog),
            target_moq: Number(moq) || 0,
            requested_customization: customizationCrafts.join('、'),
            customization_craft: customizationCrafts.join('、'),
            customization_crafts: customizationCrafts,
            onsite_customization: onsiteCustomization,
            product_highlights_zh: applyCustomizationHighlights(
              aiResult.product_highlights_zh,
              customizationCrafts,
              onsiteCustomization,
              'zh'
            ),
            product_highlights_en: applyCustomizationHighlights(
              aiResult.product_highlights_en,
              customizationCrafts,
              onsiteCustomization,
              'en'
            ),
            description_zh: stripOnsiteCopy(aiResult.description_zh, 'zh'),
            description_en: stripOnsiteCopy(aiResult.description_en, 'en'),
            source_url: sourceUrl.trim(),
            product_handle: buildProductHandle({ id: activeJobId }),
            main_image_url: '',
            main_image_urls: [],
            additional_image_urls: [],
            online_store_status: 'Y'
          };

          await db.collection('products').doc(activeJobId).update({
            aiDraft: cloneData(aiDraft || aiResult),
            finalData,
            catalogStatus: 'draft',
            categoryMain: mainCategory,
            categorySub: subCategory,
            categoryPath: categoryPath(mainCategory, subCategory, categoryCatalog),
            moq: Number(moq) || 0,
            customOptions: customizationCrafts.join('、'),
            customOptionList: customizationCrafts,
            customizationCraft: customizationCrafts.join('、'),
            onsiteCustomization,
            sourceUrl: sourceUrl.trim(),
            savedBy: {
              uid: auth.currentUser?.uid || '',
              email: auth.currentUser?.email || ''
            },
            savedAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });

          setSuccessMsg(`✅ 商品「${aiResult.title_zh}」已保存至商品庫。`);
        } catch (err) {
          setError(`儲存失敗: ${err.message}`);
        } finally {
          setIsSaving(false);
        }
      };

      return (
        <div className="p-8 max-w-[1600px] h-[calc(100vh-64px)] flex flex-col mx-auto animate-in fade-in duration-300">
          <div className="mb-6 flex justify-between items-end">
            <div>
              <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                <Wand2 className="w-6 h-6 text-blue-600"/> 商品建置中心
              </h2>
              <p className="text-gray-500 text-sm mt-1">AI 完成後先人工確認，再保存為 ERP 商品母資料。</p>
            </div>
            <div className="bg-white p-2 rounded-lg border border-gray-200 shadow-sm flex items-center gap-3">
               <Cpu className="w-5 h-5 text-gray-500" />
               <span className="text-sm font-bold text-gray-700">選擇 AI 大腦：</span>
               <select 
                 value={aiModel} 
                 onChange={(e) => setAiModel(e.target.value)}
                 className="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md focus:ring-blue-500 focus:border-blue-500 p-1.5"
               >
                  <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
                  <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                  <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
               </select>
            </div>
          </div>

          <div className="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-8 min-h-0">
            {/* 左側輸入區 */}
            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
              <div className="bg-gray-50 px-6 py-4 border-b border-gray-200 font-bold text-gray-700 flex items-center gap-2"><Plus className="w-5 h-5 text-blue-500"/> 1. 輸入商品基礎資料</div>
              <div className="p-6 flex-1 overflow-y-auto space-y-6">
                <div>
                  <label className="block text-sm font-bold text-gray-700 mb-2">商品來源網址</label>
                  <input type="url" value={sourceUrl} onChange={e => setSourceUrl(e.target.value)} className="w-full p-3 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://detail.1688.com/... 或供應商商品網址"/>
                  <p className="mt-2 text-xs text-gray-500">僅供 ERP 內部追溯來源；不交給 AI，也不匯出至 SHOPLINE。</p>
                </div>
                <div>
                  <label className="block text-sm font-bold text-gray-700 mb-2">1688 原始說明（文字）</label>
                  <textarea value={rawText} onChange={e => setRawText(e.target.value)} className="w-full h-32 p-3 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="請貼上商品名稱、材質、尺寸、容量、重量、顏色等文字資料..."/>
                  <p className="mt-2 text-xs text-amber-700 bg-amber-50 rounded-lg px-3 py-2">目前不會自動開啟 1688 商品頁；只貼網址不等於匯入網頁內容。請另外貼上規格文字或上傳清晰參數截圖。</p>
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">規格截圖（最多 5 張）</label>
                    <input type="file" multiple ref={specInputRef} onChange={handleSpecImageUpload} accept="image/*" className="w-full p-2 border border-gray-300 rounded-xl text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700"/>
                    {specImagesBase64.length > 0 && <p className="mt-2 text-xs text-green-700">已選擇 {specImagesBase64.length} 張：{specImagesBase64.map(image => image.name).join('、')}</p>}
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-4 pt-4 border-t border-gray-100">
                  <div className="space-y-4">
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-2">SHOPLINE 上架分類</label>
                      <div className="px-3 py-2 mb-2 rounded-lg bg-gray-100 text-xs font-bold text-gray-600">{SHOPLINE_ROOT_CATEGORY}</div>
                      <select value={mainCategory} onChange={handleMainCategoryChange} className="w-full p-2 border border-gray-300 rounded-xl text-sm bg-white mb-2">{Object.keys(selectableCategoryTree).map(m => <option key={m} value={m}>{m}</option>)}</select>
                      <select value={subCategory} onChange={e => setSubCategory(e.target.value)} className="w-full p-2 border border-gray-300 rounded-xl text-sm bg-white" disabled={!selectableCategoryTree[mainCategory] || selectableCategoryTree[mainCategory].length===0}>
                        {selectableCategoryTree[mainCategory]?.length > 0 ? selectableCategoryTree[mainCategory].map(s => <option key={s} value={s}>{s}</option>) : <option value="">無第三層分類</option>}
                      </select>
                      <p className="mt-2 text-xs text-blue-600">匯出路徑：{categoryPath(mainCategory, subCategory, categoryCatalog)}</p>
                    </div>
                    <div><label className="block text-sm font-bold text-gray-700 mb-2">企業起訂量 (MOQ)</label><input value={moq} onChange={e => setMoq(e.target.value)} type="number" className="w-full p-2 border border-gray-300 rounded-xl text-sm" /></div>
                  </div>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-2">客製工藝（可複選）</label>
                      <div className="rounded-xl border border-gray-300 bg-white p-2 space-y-1">
                        {customizationOptions.map(option => (
                          <label key={option} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-blue-50 cursor-pointer text-sm">
                            <input type="checkbox" checked={customizationCrafts.includes(option)} onChange={() => toggleCustomizationCraft(option)} className="rounded border-gray-300 text-blue-600 focus:ring-blue-500"/>
                            <span>{option}</span>
                          </label>
                        ))}
                      </div>
                      <p className="mt-2 text-xs text-blue-600">已選：{customizationCrafts.join('、') || '尚未選擇'}</p>
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-2">活動現場客製</label>
                      <select value={onsiteCustomization} onChange={e => handleImportOnsiteCustomization(e.target.value)} className="w-full p-2 border border-gray-300 rounded-xl text-sm bg-white">
                        <option value="N">不可</option>
                        <option value="Y">可</option>
                      </select>
                      {onsiteCustomization === 'Y' && <p className="mt-2 text-xs text-green-700">儲存時會在中英文商品特色加入活動現場客製工藝。</p>}
                    </div>
                  </div>
                </div>
              </div>
              <div className="p-6 bg-gray-50 border-t border-gray-200">
                {error && <div className="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg flex items-center gap-2"><AlertCircle className="w-5 h-5 shrink-0"/> {error}</div>}
                {successMsg && <div className="mb-4 p-3 bg-green-100 text-green-700 text-sm rounded-lg flex items-center gap-2"><CheckCircle2 className="w-5 h-5 shrink-0"/> {successMsg}</div>}
                <button onClick={handleGenerate} disabled={isGenerating} className={`w-full py-4 rounded-xl font-bold flex items-center justify-center gap-2 shadow-md transition-all text-lg ${isGenerating ? 'bg-gray-300 text-gray-600 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 text-white'}`}>
                  {isGenerating ? <><Loader2 className="w-6 h-6 animate-spin"/> {jobStatus === 'processing' ? 'AI 分析中...' : '等待雲端處理...'}</> : <><Cloud className="w-6 h-6"/> 2. 送出 AI 處理</>}
                </button>
              </div>
            </div>

            {/* 右側預覽區 */}
            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col overflow-hidden relative">
               <div className="bg-gray-800 px-6 py-4 border-b border-gray-900 font-bold text-white flex justify-between items-center"><span className="flex items-center gap-2"><Eye className="w-5 h-5 text-green-400"/> 3. 本次商品確認</span></div>
               <div className="flex-1 overflow-y-auto p-6 bg-gray-50/50 relative">
                 {!aiResult && (
                    <div className="absolute inset-0 flex flex-col items-center justify-center text-gray-400">
                       <FileText className="w-16 h-16 mb-4 opacity-20" />
                       <p>{isGenerating ? '等待本次商品處理完成中...' : '請先建立一筆商品'}</p>
                    </div>
                 )}
                 {aiResult && (
                    <div className="space-y-6 animate-in slide-in-from-bottom-4 duration-500 pb-20">
                      <div className="bg-white p-5 rounded-xl border border-blue-100 shadow-sm space-y-4">
                        <h3 className="font-bold text-blue-800 border-b border-blue-50 pb-2">🇹🇼 繁體中文版</h3>
                        <div><label className="block text-xs font-bold text-gray-500 mb-1">商品名稱</label><input type="text" value={aiResult.title_zh || ''} onChange={e => handlePreviewChange('title_zh', e.target.value)} className="w-full p-2 border border-gray-200 rounded text-sm font-bold text-gray-900" /></div>
                        <div><label className="block text-xs font-bold text-gray-500 mb-1">詳細描述</label><textarea value={aiResult.description_zh || ''} onChange={e => handlePreviewChange('description_zh', e.target.value)} className="w-full p-3 border border-gray-200 rounded text-sm min-h-[150px]" /></div>
                      </div>
                    </div>
                 )}
               </div>
               <div className="p-6 bg-white border-t border-gray-200 absolute bottom-0 left-0 right-0">
                  <button onClick={handleSave} disabled={!aiResult || isSaving} className={`w-full py-4 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg transition-all text-lg ${!aiResult ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-green-600 hover:bg-green-500 text-white'}`}>
                    <Save className="w-6 h-6"/> 確認無誤，保存至商品庫
                  </button>
                  {aiResult && (
                    <button onClick={onOpenLibrary} className="w-full mt-2 text-sm text-blue-600 hover:text-blue-800 font-medium">
                      前往商品庫瀏覽與編輯
                    </button>
                  )}
               </div>
            </div>
          </div>
        </div>
      );
    };

    const ProductEditor = ({ product, onBack, categoryCatalog }) => {
      const baseData = getWorkingData(product);
      const parsedCategory = getCategoryParts(product, baseData, categoryCatalog);
      const editorCategoryTree = buildCategoryTree(categoryCatalog);
      if (isValidCategory(parsedCategory.main, parsedCategory.sub, categoryCatalog)) {
        if (!editorCategoryTree[parsedCategory.main]) editorCategoryTree[parsedCategory.main] = [];
        if (parsedCategory.sub && !editorCategoryTree[parsedCategory.main].includes(parsedCategory.sub)) {
          editorCategoryTree[parsedCategory.main].push(parsedCategory.sub);
        }
      }
      const fallbackMain = Object.keys(editorCategoryTree)[0] || '';
      const initialCategory = isValidCategory(parsedCategory.main, parsedCategory.sub, categoryCatalog)
        ? parsedCategory
        : { main: fallbackMain, sub: editorCategoryTree[fallbackMain]?.[0] || '' };
      const initialCrafts = normalizeCustomizationCrafts(
        baseData.customization_crafts,
        baseData.customization_craft,
        baseData.requested_customization,
        product.customOptionList,
        product.customizationCraft,
        product.customOptions
      );
      const initialOnsiteCustomization = baseData.onsite_customization || product.onsiteCustomization || 'N';
      const [formData, setFormData] = useState({
        title_zh: baseData.title_zh || '',
        title_en: baseData.title_en || '',
        description_zh: stripOnsiteCopy(baseData.description_zh, 'zh'),
        description_en: stripOnsiteCopy(baseData.description_en, 'en'),
        highlights_zh: joinLines(applyCustomizationHighlights(baseData.product_highlights_zh, initialCrafts, initialOnsiteCustomization, 'zh')),
        highlights_en: joinLines(applyCustomizationHighlights(baseData.product_highlights_en, initialCrafts, initialOnsiteCustomization, 'en')),
        seo_title_zh: baseData.seo_title_zh || '',
        seo_title_en: baseData.seo_title_en || '',
        seo_description_zh: baseData.seo_description_zh || '',
        seo_description_en: baseData.seo_description_en || '',
        seo_keywords: Array.isArray(baseData.seo_keywords) ? baseData.seo_keywords.join(', ') : '',
        source_url: baseData.source_url || product.sourceUrl || '',
        material: baseData.extracted?.material || '',
        dimensions: baseData.extracted?.dimensions || '',
        capacity: baseData.extracted?.capacity || '',
        weight: baseData.extracted?.weight || '',
        colors: joinLines(baseData.extracted?.colors),
        target_moq: baseData.target_moq ?? product.moq ?? '',
        customization_crafts: initialCrafts,
        onsite_customization: initialOnsiteCustomization,
        product_handle: buildProductHandle(product),
        main_image_urls: (() => {
          const urls = normalizeUrlList(baseData.main_image_urls, baseData.main_image_url, MAX_MAIN_IMAGES);
          return urls.length > 0 ? urls : [''];
        })(),
        additional_image_urls: (() => {
          const urls = normalizeUrlList(baseData.additional_image_urls, baseData.additional_images, MAX_ADDITIONAL_IMAGES);
          return urls.length > 0 ? urls : [''];
        })(),
        online_store_status: baseData.online_store_status === 'N' ? 'N' : 'Y',
        categoryMain: initialCategory.main,
        categorySub: initialCategory.sub
      });
      const [isSaving, setIsSaving] = useState(false);
      const [isSyncingEnglish, setIsSyncingEnglish] = useState(false);
      const [message, setMessage] = useState('');
      const [error, setError] = useState('');

      const updateField = (field, value) => setFormData(prev => ({ ...prev, [field]: value }));
      const toggleEditorCraft = (craft) => {
        setFormData(prev => {
          const nextCrafts = prev.customization_crafts.includes(craft)
            ? prev.customization_crafts.filter(item => item !== craft)
            : [...prev.customization_crafts, craft];
          return {
            ...prev,
            customization_crafts: nextCrafts,
            highlights_zh: joinLines(applyCustomizationHighlights(prev.highlights_zh, nextCrafts, prev.onsite_customization, 'zh')),
            highlights_en: joinLines(applyCustomizationHighlights(prev.highlights_en, nextCrafts, prev.onsite_customization, 'en'))
          };
        });
      };
      const updateImageUrl = (field, index, value) => {
        setFormData(prev => ({
          ...prev,
          [field]: prev[field].map((item, itemIndex) => itemIndex === index ? value : item)
        }));
      };
      const addImageUrlField = (field, maxItems) => {
        setFormData(prev => prev[field].length >= maxItems
          ? prev
          : { ...prev, [field]: [...prev[field], ''] });
      };
      const removeImageUrlField = (field, index) => {
        setFormData(prev => {
          const remaining = prev[field].filter((_, itemIndex) => itemIndex !== index);
          return { ...prev, [field]: remaining.length > 0 ? remaining : [''] };
        });
      };
      const handleCategoryMain = (main) => {
        setFormData(prev => ({ ...prev, categoryMain: main, categorySub: editorCategoryTree[main]?.[0] || '' }));
      };
      const handleOnsiteCustomization = (value) => {
        setFormData(prev => ({
          ...prev,
          onsite_customization: value,
          highlights_zh: joinLines(applyCustomizationHighlights(prev.highlights_zh, prev.customization_crafts, value, 'zh')),
          highlights_en: joinLines(applyCustomizationHighlights(prev.highlights_en, prev.customization_crafts, value, 'en')),
          description_zh: stripOnsiteCopy(prev.description_zh, 'zh'),
          description_en: stripOnsiteCopy(prev.description_en, 'en')
        }));
      };

      const handleEnglishSync = async () => {
        if (!formData.title_zh.trim() && !formData.description_zh.trim() && !formData.highlights_zh.trim()) {
          return setError('請先填寫繁中商品名稱或商品文案，再執行英文同步。');
        }

        setIsSyncingEnglish(true);
        setError('');
        setMessage('');

        try {
          const token = await auth.currentUser?.getIdToken();
          if (!token) throw new Error('登入狀態已失效，請重新登入。');

          const response = await fetch(`${BACKEND_URL}/api/sync-english`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              title_zh: formData.title_zh.trim(),
              product_highlights_zh: applyCustomizationHighlights(
                formData.highlights_zh,
                formData.customization_crafts,
                formData.onsite_customization,
                'zh'
              ),
              description_zh: stripOnsiteCopy(formData.description_zh, 'zh'),
              seo_title_zh: formData.seo_title_zh.trim(),
              seo_description_zh: formData.seo_description_zh.trim()
            })
          });

          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.error || `英文同步失敗（HTTP ${response.status}）`);

          const translated = payload.result || {};
          setFormData(prev => ({
            ...prev,
            title_en: translated.title_en || '',
            highlights_zh: joinLines(applyCustomizationHighlights(
              prev.highlights_zh,
              prev.customization_crafts,
              prev.onsite_customization,
              'zh'
            )),
            highlights_en: joinLines(applyCustomizationHighlights(
              translated.product_highlights_en,
              prev.customization_crafts,
              prev.onsite_customization,
              'en'
            )),
            description_zh: stripOnsiteCopy(prev.description_zh, 'zh'),
            description_en: stripOnsiteCopy(translated.description_en, 'en'),
            seo_title_en: translated.seo_title_en || '',
            seo_description_en: translated.seo_description_en || ''
          }));
          setMessage('✅ 英文內容已依目前繁中文案同步，請確認後按「儲存修改」。');
        } catch (syncError) {
          setError(`英文同步失敗：${syncError.message}`);
        } finally {
          setIsSyncingEnglish(false);
        }
      };

      const handleSave = async () => {
        if (!formData.title_zh.trim() && !formData.title_en.trim()) {
          return setError('中文或英文商品名稱至少要填寫一個。');
        }
        if (!formData.product_handle.trim()) {
          return setError('商品編號不可留白。');
        }
        if (formData.customization_crafts.length === 0) return setError('請至少選擇一項客製工藝。');
        const mainImageUrls = normalizeUrlList(formData.main_image_urls, '', Number.MAX_SAFE_INTEGER);
        const additionalImageUrls = normalizeUrlList(formData.additional_image_urls, '', Number.MAX_SAFE_INTEGER);
        if (mainImageUrls.length > MAX_MAIN_IMAGES) return setError(`商品主要圖片最多 ${MAX_MAIN_IMAGES} 張。`);
        if (additionalImageUrls.length > MAX_ADDITIONAL_IMAGES) return setError(`更多圖片最多 ${MAX_ADDITIONAL_IMAGES} 張。`);
        if (mainImageUrls.some(url => !isValidShoplineImageUrl(url))) {
          return setError('商品主要圖片網址須以 https:// 開頭，且不能包含空格或中文字。');
        }
        if (additionalImageUrls.some(url => !isValidShoplineImageUrl(url))) {
          return setError('更多圖片網址須以 https:// 開頭，且不能包含空格或中文字。');
        }

        setIsSaving(true);
        setError('');
        setMessage('');

        try {
          const currentData = getWorkingData(product);
          const finalData = {
            ...currentData,
            title_zh: formData.title_zh.trim(),
            title_en: formData.title_en.trim(),
            description_zh: stripOnsiteCopy(formData.description_zh, 'zh'),
            description_en: stripOnsiteCopy(formData.description_en, 'en'),
            product_highlights_zh: applyCustomizationHighlights(
              formData.highlights_zh,
              formData.customization_crafts,
              formData.onsite_customization,
              'zh'
            ),
            product_highlights_en: applyCustomizationHighlights(
              formData.highlights_en,
              formData.customization_crafts,
              formData.onsite_customization,
              'en'
            ),
            seo_title_zh: formData.seo_title_zh.trim(),
            seo_title_en: formData.seo_title_en.trim(),
            seo_description_zh: formData.seo_description_zh.trim(),
            seo_description_en: formData.seo_description_en.trim(),
            seo_keywords: splitComma(formData.seo_keywords),
            source_url: formData.source_url.trim(),
            extracted: {
              ...(currentData.extracted || {}),
              material: formData.material.trim(),
              dimensions: formData.dimensions.trim(),
              capacity: formData.capacity.trim(),
              weight: formData.weight.trim(),
              colors: splitLines(formData.colors)
            },
            category: categoryPath(formData.categoryMain, formData.categorySub, categoryCatalog),
            target_moq: Number(formData.target_moq) || 0,
            requested_customization: formData.customization_crafts.join('、'),
            customization_craft: formData.customization_crafts.join('、'),
            customization_crafts: formData.customization_crafts,
            onsite_customization: formData.onsite_customization,
            product_handle: formData.product_handle.trim(),
            main_image_url: mainImageUrls[0] || '',
            main_image_urls: mainImageUrls,
            additional_image_urls: additionalImageUrls,
            online_store_status: formData.online_store_status
          };

          await db.collection('products').doc(product.id).update({
            aiDraft: cloneData(product.aiDraft || product.aiResult || {}),
            finalData,
            catalogStatus: 'draft',
            categoryMain: formData.categoryMain,
            categorySub: formData.categorySub,
            categoryPath: categoryPath(formData.categoryMain, formData.categorySub, categoryCatalog),
            productHandle: formData.product_handle.trim(),
            moq: Number(formData.target_moq) || 0,
            customOptions: formData.customization_crafts.join('、'),
            customOptionList: formData.customization_crafts,
            customizationCraft: formData.customization_crafts.join('、'),
            onsiteCustomization: formData.onsite_customization,
            sourceUrl: formData.source_url.trim(),
            savedBy: {
              uid: auth.currentUser?.uid || '',
              email: auth.currentUser?.email || ''
            },
            savedAt: product.savedAt || serverTimestamp(),
            updatedAt: serverTimestamp()
          });

          setMessage('✅ 商品資料已儲存。重新整理或離開後再回來，內容仍會保留。');
        } catch (saveError) {
          setError(`儲存失敗：${saveError.message}`);
        } finally {
          setIsSaving(false);
        }
      };

      const fieldClass = "w-full p-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none";
      const labelClass = "block text-xs font-bold text-gray-500 mb-1";

      return (
        <div className="p-8 max-w-6xl mx-auto animate-in fade-in duration-200">
          <div className="flex items-center justify-between mb-6">
            <div className="flex items-center gap-3">
              <button onClick={onBack} className="p-2 rounded-lg border border-gray-200 bg-white hover:bg-gray-50"><ArrowLeft className="w-5 h-5"/></button>
              <div>
                <h2 className="text-2xl font-bold text-gray-800">編輯商品</h2>
                <p className="text-xs text-gray-400 mt-1">Firestore ID：{product.id}</p>
              </div>
            </div>
            <button onClick={handleSave} disabled={isSaving} className="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white rounded-lg font-bold flex items-center gap-2">
              {isSaving ? <Loader2 className="w-4 h-4 animate-spin"/> : <Save className="w-4 h-4"/>} 儲存修改
            </button>
          </div>

          {error && <div className="mb-4 p-3 bg-red-50 text-red-700 rounded-lg text-sm">{error}</div>}
          {message && <div className="mb-4 p-3 bg-green-50 text-green-700 rounded-lg text-sm">{message}</div>}

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <section className="bg-white border border-gray-200 rounded-xl p-5 space-y-4 shadow-sm">
              <h3 className="font-bold text-gray-800 border-b pb-3">基本資料與分類</h3>
              <div><label className={labelClass}>商品名稱（繁中）</label><input className={fieldClass} value={formData.title_zh} onChange={e => updateField('title_zh', e.target.value)}/></div>
              <div><label className={labelClass}>商品名稱（英文）</label><input className={fieldClass} value={formData.title_en} onChange={e => updateField('title_en', e.target.value)}/></div>
              <div>
                <label className={labelClass}>商品來源網址</label>
                <input type="url" className={fieldClass} value={formData.source_url} onChange={e => updateField('source_url', e.target.value)} placeholder="https://detail.1688.com/... 或供應商商品網址"/>
                <p className="mt-1.5 text-xs text-gray-400">僅供內部記錄，可隨時修改；不交給 AI、不匯出 SHOPLINE。</p>
              </div>
              <div>
                <label className={labelClass}>第一層分類（固定）</label>
                <div className="w-full p-2.5 bg-gray-100 border border-gray-200 rounded-lg text-sm font-bold text-gray-600">{SHOPLINE_ROOT_CATEGORY}</div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className={labelClass}>第二層分類</label><select className={fieldClass} value={formData.categoryMain} onChange={e => handleCategoryMain(e.target.value)}>{Object.keys(editorCategoryTree).map(item => <option key={item}>{item}</option>)}</select></div>
                <div><label className={labelClass}>第三層分類</label><select className={fieldClass} value={formData.categorySub} onChange={e => updateField('categorySub', e.target.value)} disabled={!editorCategoryTree[formData.categoryMain]?.length}>{editorCategoryTree[formData.categoryMain]?.length > 0 ? editorCategoryTree[formData.categoryMain].map(item => <option key={item}>{item}</option>) : <option value="">無第三層分類</option>}</select></div>
              </div>
              <p className="text-xs text-blue-600 bg-blue-50 rounded-lg px-3 py-2">SHOPLINE 匯出路徑：{categoryPath(formData.categoryMain, formData.categorySub, categoryCatalog)}</p>
              <div className="grid grid-cols-2 gap-3">
                <div><label className={labelClass}>目標 MOQ</label><input type="number" className={fieldClass} value={formData.target_moq} onChange={e => updateField('target_moq', e.target.value)}/></div>
                <div>
                  <label className={labelClass}>客製工藝（可複選）</label>
                  <div className="rounded-lg border border-gray-200 bg-white p-2 space-y-1">
                    {customizationOptions.map(option => (
                      <label key={option} className="flex items-center gap-2 px-2 py-1.5 rounded-md hover:bg-blue-50 cursor-pointer text-sm">
