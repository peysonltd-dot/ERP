<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peyson 雲端 ERP 系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <!-- Firebase Compat (相容模式) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      LayoutDashboard, Package, FileText, Settings, Search, Wand2, Download, CheckCircle2, 
      AlertCircle, Loader2, Building2, ShoppingCart, Trash2, Cloud, Filter, Users, LogOut, 
      User, Shield, ArrowRight, Plus, Stamp, FileSignature, X, Eye, FileDigit, CheckSquare, 
      Square, Edit3, Save, ArrowLeft, ImagePlus, UploadCloud, Upload, Briefcase, DollarSign, 
      Gift, Menu, UserCheck, Lock, Key, Cpu
    } from 'https://esm.sh/lucide-react@0.294.0?deps=react@18.2.0';

    // ==========================================
    // --- Firebase 初始化 ---
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyC2urkxTWNz1EVy08MxyGfmAcPjGaU95CA",
      authDomain: "peyson-erp.firebaseapp.com",
      projectId: "peyson-erp",
      storageBucket: "peyson-erp.firebasestorage.app",
      messagingSenderId: "350290827046",
      appId: "1:350290827046:web:f1ff892ac31e7f3912d3e7",
      measurementId: "G-G9ZEWEXVBS"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const storage = firebase.storage();
    const auth = firebase.auth();

    // --- 分類常數 ---
    const categoryTree = {
      "餐廚用品": ["開瓶器", "杯墊", "冰塊", "環保餐具"],
      "水瓶/杯子": ["環保杯", "保溫杯", "馬克杯", "水壺", "酒杯/茶杯"],
      "包包袋子": ["帆布袋", "飲料提袋", "手提袋", "收納袋", "背包"],
      "文具 | 商務禮品": ["筆", "金屬筆", "廣告筆", "捲尺 | 尺", "便條紙", "證件套", "文具袋", "資料夾", "辦公周邊", "月曆", "筆記本"],
      "旅行戶外": ["汽車用品", "行李箱周邊", "旅行插頭", "雨具 | 傘", "風扇", "露營用品"],
      "家居用品": ["抱枕", "毛毯", "毛巾", "收納"],
      "電子產品/周邊": ["充電線", "行動電源", "無線充電盤", "手機背繩", "藍芽音響", "卡套", "其他3C", "周邊小物"],
      "生活小物": ["拼圖", "鑰匙圈", "手機架", "捲尺"],
      "ESG環保禮品": [],
      "服飾": ["T恤", "大學T", "帽T", "帽子", "飾品"]
    };

    const shoplineHeadersEn = [
      "Product Handle*", "Product Name(English)*", "Product Name(Chinese)*", "Product Summary(English)", "Product Summary(Chinese)",
      "Product Description(English)", "Product Description(Chinese)", "SEO Title(English)", "SEO Title(Chinese)",
      "SEO Description(English)", "SEO Description(Chinese)", "SEO Keywords", "Preorder Feature", "Preorder Note(English)",
      "Preorder Note(Chinese)", "Unlimited Preorder Supply", "Preorder Limit", "Online Store Status",
      "Max.12 images for each product (If the Variant Image App is installed, up to 300 main images are supported. Please note that the total character count for all image links must not exceed the Excel cell limit.)*",
      "Additional Images", "Online Store Categories(English)", "Online Store Categories(Chinese)", "Price", "Sales Price", "Cost", "SKU",
      "Member Price", "Quantity", "Weight(KG)", "Product Tag", "Hidden Product", "Exclude Payment Options", "Exclude Delivery Options",
      "Specification Name A(English)", "Specification Name A(Chinese)", "Specification Name B(English)", "Specification Name B(Chinese)",
      "Variation Image", "Variation name A(English)", "Variation name A(Chinese)", "Variation name B(English)",
      "Variation name B(Chinese)", "Variation quantity", "Variation price", "Variant Sale Price", "Variant Member Price",
      "Variant Cost", "Variation SKU", "Variant Weight(KG)", "Barcode"
    ];

    const shoplineHeadersZh = [
      "商品編號*", "商品名稱(英文)*", "商品名稱(繁體中文)*", "商品摘要(英文)", "商品摘要(繁體中文)", "商品描述(英文)",
      "商品描述(繁體中文)", "SEO標題(英文)", "SEO標題(繁體中文)", "SEO簡介(英文)", "SEO簡介(繁體中文)", "SEO關鍵字",
      "預購功能", "預購提示(英文)", "預購提示(繁體中文)", "預購商品可無限供貨", "預購上限", "網店上架狀態",
      "每件商品最多 12 張主要圖片（若有多款式商品圖片擴充功能，則最多 300 張主要圖片。請注意，所有圖片連結的總字數不可超過 Excel 儲存格限制）*",
      "更多相片 (每件產品最多20張主要圖片， Max.20 images for each product)", "網店分類(英文)", "網店分類(繁體中文)",
      "原價格", "特價", "成本價", "商品貨號", "商品會員價", "數量", "重量(KG)", "商品管理標籤", "隱藏商品",
      "排除的付款方式", "排除的送貨方式", "規格名稱1(英文)", "規格名稱1(繁體中文)", "規格名稱2(英文)",
      "規格名稱2(繁體中文)", "款式圖片 (每個款式最多 1 張款式圖片， Max.1 image for each variant)", "選項名稱A(英文)",
      "選項名稱A(繁體中文)", "選項名稱B(英文)", "選項名稱B(繁體中文)", "選項數量", "選項價格", "款式特價",
      "款式會員價", "款式成本", "選項商品貨號", "款式重量(KG)", "商品條碼編號"
    ];

    const serverTimestamp = () => firebase.firestore.FieldValue.serverTimestamp();
    const cloneData = (value) => JSON.parse(JSON.stringify(value || {}));
    const splitLines = (value) => String(value || '').split('\n').map(item => item.trim()).filter(Boolean);
    const splitComma = (value) => String(value || '').split(/[,，\n]/).map(item => item.trim()).filter(Boolean);
    const joinLines = (value) => Array.isArray(value) ? value.join('\n') : '';
    const categoryPath = (main, sub) => [main, sub].filter(Boolean).join('>');
    const buildProductHandle = (product = {}) => {
      const data = product.finalData || product.aiResult || {};
      const existing = data.product_handle || product.productHandle;
      if (existing) return String(existing).trim();
      const safeId = String(product.id || '').replace(/[^a-zA-Z0-9]/g, '').slice(0, 12).toUpperCase();
      return safeId ? `PEY-${safeId}` : '';
    };

    const buildSummary = (items) => (Array.isArray(items) ? items : [])
      .map(item => String(item || '').replace(/^[・•\-]\s*/, '').trim())
      .filter(Boolean)
      .map(item => `・${item}`)
      .join('\n\n');

    const getShoplineCategory = (product = {}, data = {}) =>
      String(product.categoryPath || data.category || '').replace(/\s*>\s*/g, '>').trim();

    const getExportIssues = (product = {}) => {
      const data = getWorkingData(product);
      const issues = [];
      const handle = buildProductHandle(product);
      const category = getShoplineCategory(product, data);
      const imageUrl = String(data.main_image_url || '').trim();
      const summaryZh = buildSummary(data.product_highlights_zh);
      const summaryEn = buildSummary(data.product_highlights_en);

      if (!product.finalData) issues.push('尚未保存人工確認版本');
      if (!handle) issues.push('缺少商品編號');
      if (!String(data.title_zh || '').trim() && !String(data.title_en || '').trim()) issues.push('缺少商品名稱');
      if (!category) {
        issues.push('缺少網店分類');
      } else {
        const [main, sub = ''] = category.split('>');
        if (!categoryTree[main] || (sub && !categoryTree[main].includes(sub))) issues.push('分類不在 ERP 分類清單');
      }
      if (!imageUrl) {
        issues.push('缺少商品主圖網址');
      } else if (!/^https?:\/\/\S+$/i.test(imageUrl)) {
        issues.push('商品主圖網址格式不正確');
      }
      if (summaryZh.length > 300) issues.push('繁中商品摘要超過 300 字');
      if (summaryEn.length > 300) issues.push('英文商品摘要超過 300 字');
      return issues;
    };

    const buildShoplineRow = (product = {}) => {
      const data = getWorkingData(product);
      const row = Array(shoplineHeadersEn.length).fill('');
      row[0] = buildProductHandle(product);
      row[1] = String(data.title_en || '').trim();
      row[2] = String(data.title_zh || '').trim();
      row[3] = buildSummary(data.product_highlights_en);
      row[4] = buildSummary(data.product_highlights_zh);
      row[5] = String(data.description_en || '').trim();
      row[6] = String(data.description_zh || '').trim();
      row[7] = String(data.seo_title_en || '').trim();
      row[8] = String(data.seo_title_zh || '').trim();
      row[9] = String(data.seo_description_en || '').trim();
      row[10] = String(data.seo_description_zh || '').trim();
      row[11] = Array.isArray(data.seo_keywords) ? data.seo_keywords.join(',') : String(data.seo_keywords || '').trim();
      row[12] = 'N';
      row[17] = data.online_store_status === 'N' ? 'N' : 'Y';
      row[18] = String(data.main_image_url || '').trim();
      row[21] = getShoplineCategory(product, data);
      row[25] = String(data.sku || '').trim();
      row[30] = 'N';
      return row;
    };

    const csvCell = (value) => {
      const text = String(value ?? '');
      return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    };

    const downloadBlob = (content, filename, type) => {
      const url = URL.createObjectURL(new Blob([content], { type }));
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    };

    const exportFilename = (extension) => {
      const now = new Date();
      const stamp = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, '0'),
        String(now.getDate()).padStart(2, '0'),
        '-',
        String(now.getHours()).padStart(2, '0'),
        String(now.getMinutes()).padStart(2, '0')
      ].join('');
      return `Peyson-SHOPLINE-${stamp}.${extension}`;
    };

    const getCategoryParts = (product = {}, productData = {}) => {
      if (product.categoryMain) {
        return { main: product.categoryMain, sub: product.categorySub || '' };
      }

      const raw = product.categoryPath || productData.category || product.category || '';
      const separator = raw.includes('>') ? '>' : ' - ';
      const [main = Object.keys(categoryTree)[0], sub = ''] = raw.split(separator);
      return {
        main: categoryTree[main] ? main : Object.keys(categoryTree)[0],
        sub
      };
    };

    const getWorkingData = (product = {}) => cloneData(product.finalData || product.aiResult || {});

    const formatDate = (timestamp) => {
      if (!timestamp) return '—';
      const date = typeof timestamp.toDate === 'function' ? timestamp.toDate() : new Date(timestamp);
      return Number.isNaN(date.getTime()) ? '—' : date.toLocaleString('zh-TW', { hour12: false });
    };

    const getProductState = (product = {}) => {
      if (product.status === 'pending') return { key: 'processing', label: '排隊中', className: 'bg-amber-50 text-amber-700' };
      if (product.status === 'processing') return { key: 'processing', label: 'AI 處理中', className: 'bg-blue-50 text-blue-700' };
      if (product.status === 'error') return { key: 'error', label: '處理失敗', className: 'bg-red-50 text-red-700' };
      if (product.finalData) return { key: 'saved', label: '已儲存', className: 'bg-green-50 text-green-700' };
      if (product.aiResult) return { key: 'review', label: '待確認', className: 'bg-violet-50 text-violet-700' };
      return { key: 'unknown', label: '資料不完整', className: 'bg-gray-100 text-gray-600' };
    };

    // ==========================================
    // 元件 1：Firebase 安全登入畫面
    // ==========================================
    const SimpleLogin = () => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setIsLoading(true);
        try {
          // 呼叫 Firebase 進行真實登入驗證
          await auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
          console.error("登入失敗:", err);
          setError('登入失敗：帳號或密碼錯誤。');
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
          <div className="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 w-full max-w-md animate-in fade-in zoom-in duration-300">
            <div className="text-center mb-8">
              <div className="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <Shield className="w-8 h-8 text-white" />
              </div>
              <h1 className="text-2xl font-bold tracking-wider text-gray-900">PEYSON<span className="text-blue-500">.ERP</span></h1>
              <p className="text-gray-500 text-sm mt-2">系統已啟用 Firebase 安全加密</p>
            </div>
            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">企業信箱帳號</label>
                <div className="relative">
                  <User className="w-5 h-5 absolute left-3 top-2.5 text-gray-400" />
                  <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="例如：admin@peyson.com" />
                </div>
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">登入密碼</label>
                <div className="relative">
                  <Lock className="w-5 h-5 absolute left-3 top-2.5 text-gray-400" />
                  <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="請輸入密碼" />
                </div>
              </div>
              {error && <div className="p-3 bg-red-50 text-red-600 text-sm rounded-lg flex items-center gap-2"><AlertCircle className="w-4 h-4 shrink-0"/> {error}</div>}
              <button type="submit" disabled={isLoading} className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-md transition-all flex justify-center items-center gap-2 disabled:bg-gray-400">
                {isLoading ? <Loader2 className="w-5 h-5 animate-spin" /> : '安全登入系統'}
              </button>
            </form>
          </div>
        </div>
      );
    };

    // ==========================================
    // 元件 2：AI 流水線工作台
    // ==========================================
    const AIImportView = ({ onOpenLibrary }) => {
      const [rawText, setRawText] = useState('');
      const [moq, setMoq] = useState(50);
      const [mainCategory, setMainCategory] = useState(Object.keys(categoryTree)[0]);
      const [subCategory, setSubCategory] = useState(categoryTree[Object.keys(categoryTree)[0]][0] || '');
      const [customOptions, setCustomOptions] = useState(['雷射雕刻']);
      const availableOptions = ["雷射雕刻", "網版印刷", "彩色UV直印", "燙金/燙銀", "皮革壓印", "客製化外包裝盒"];
      
      const [specImageBase64, setSpecImageBase64] = useState(null);
      const specInputRef = useRef(null);

      const [aiModel, setAiModel] = useState('gemini-3.6-flash');
      const [aiResult, setAiResult] = useState(null);
      const [aiDraft, setAiDraft] = useState(null);
      const [activeJobId, setActiveJobId] = useState('');
      const [jobStatus, setJobStatus] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [error, setError] = useState('');
      const [successMsg, setSuccessMsg] = useState('');

      const handleOptionToggle = (opt) => setCustomOptions(prev => prev.includes(opt) ? prev.filter(o => o !== opt) : [...prev, opt]);
      const handleMainCategoryChange = (e) => { const selectedMain = e.target.value; setMainCategory(selectedMain); setSubCategory(categoryTree[selectedMain][0] || ''); };

      const handleSpecImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setSpecImageBase64({ mimeType: file.type, data: reader.result.split(',')[1] });
          reader.readAsDataURL(file);
        }
      };

      useEffect(() => {
        if (!activeJobId) return undefined;

        const unsubscribe = db.collection('products').doc(activeJobId).onSnapshot((snapshot) => {
          if (!snapshot.exists) return;
          const docData = snapshot.data();
          setJobStatus(docData.status || '');

          if (docData.status === 'completed' && docData.aiResult) {
            const originalDraft = cloneData(docData.aiResult);
            setAiDraft(originalDraft);
            setAiResult(cloneData(docData.finalData || originalDraft));
            setIsGenerating(false);
            if (!docData.finalData) {
              setSuccessMsg(`✨ AI 處理完成：${docData.aiResult.title_zh}`);
            }
          }

          if (docData.status === 'error') {
            setIsGenerating(false);
            setError(`AI 處理失敗：${docData.errorMsg || '請稍後再試'}`);
          }
        }, (snapshotError) => {
          console.error("監聽商品失敗:", snapshotError);
          setIsGenerating(false);
          setError(`無法取得處理結果：${snapshotError.message}`);
        });

        return () => unsubscribe();
      }, [activeJobId]);

      const handleGenerate = async () => {
        if (!rawText.trim() && !specImageBase64) return setError('請貼上文字說明或上傳規格圖片！');
        
        setError(''); setSuccessMsg(''); setIsGenerating(true); 

        try {
          let imageUrl = null;

          if (specImageBase64) {
            setSuccessMsg('上傳圖片至雲端...');
            const byteCharacters = atob(specImageBase64.data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: specImageBase64.mimeType });

            const fileName = `specs/${Date.now()}.jpg`;
            const storageRef = storage.ref().child(fileName);
            await storageRef.put(blob);
            imageUrl = await storageRef.getDownloadURL();
          }

          setSuccessMsg('建立雲端任務中...');

          const customStr = customOptions.length > 0 ? customOptions.join('、') : '一般客製化';
          const selectedCategoryPath = categoryPath(mainCategory, subCategory);
          const docRef = await db.collection('products').add({
            status: 'pending',
            catalogStatus: 'ai_processing',
            rawText: rawText,
            imageUrl: imageUrl,
            sourceImages: imageUrl ? [imageUrl] : [],
            moq: Number(moq) || 0,
            category: selectedCategoryPath,
            categoryMain: mainCategory,
            categorySub: subCategory,
            categoryPath: selectedCategoryPath,
            customOptions: customStr,
            customOptionList: customOptions,
            aiModel: aiModel,
            createdBy: {
              uid: auth.currentUser?.uid || '',
              email: auth.currentUser?.email || ''
            },
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });

          setActiveJobId(docRef.id);
          setJobStatus('pending');
          setAiResult(null);
          setAiDraft(null);
          setRawText('');
          setSpecImageBase64(null);
          if (specInputRef.current) specInputRef.current.value = '';
          setSuccessMsg('✅ 任務已送交雲端，正在等待 AI 完成。');

        } catch (err) {
          console.error("上傳失敗:", err);
          setError(`任務建立失敗: ${err.message}`);
          setIsGenerating(false);
        }
      };

      const handlePreviewChange = (field, val) => { setAiResult({ ...aiResult, [field]: val }); };

      const handleSave = async () => {
        if (!aiResult || !activeJobId) return;
        setIsSaving(true); setError(''); setSuccessMsg('');
        try {
          const finalData = {
            ...cloneData(aiResult),
            category: categoryPath(mainCategory, subCategory),
            target_moq: Number(moq) || 0,
            requested_customization: customOptions.join('、'),
            product_handle: buildProductHandle({ id: activeJobId }),
            main_image_url: '',
            online_store_status: 'Y'
          };

          await db.collection('products').doc(activeJobId).update({
            aiDraft: cloneData(aiDraft || aiResult),
            finalData,
            catalogStatus: 'draft',
            categoryMain: mainCategory,
            categorySub: subCategory,
            categoryPath: categoryPath(mainCategory, subCategory),
            moq: Number(moq) || 0,
            customOptions: customOptions.join('、'),
            customOptionList: customOptions,
            savedBy: {
              uid: auth.currentUser?.uid || '',
              email: auth.currentUser?.email || ''
            },
            savedAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });

          setSuccessMsg(`✅ 商品「${aiResult.title_zh}」已保存至商品庫。`);
        } catch (err) {
          setError(`儲存失敗: ${err.message}`);
        } finally {
          setIsSaving(false);
        }
      };

      return (
        <div className="p-8 max-w-[1600px] h-[calc(100vh-64px)] flex flex-col mx-auto animate-in fade-in duration-300">
          <div className="mb-6 flex justify-between items-end">
            <div>

    const ProductEditor = ({ product, onBack }) => {
      const baseData = getWorkingData(product);
      const initialCategory = getCategoryParts(product, baseData);

        title_zh: baseData.title_zh || '',

        highlights_en: joinLines(baseData.product_highlights_en),
        seo_title_zh: baseData.seo_title_zh || '',

        seo_description_zh: baseData.seo_description_zh || '',
        seo_description_en: baseData.seo_description_en || '',
        seo_keywords: Array.isArray(baseData.seo_keywords) ? baseData.seo_keywords.join(', ') : '',
        material: baseData.extracted?.material || '',
        dimensions: baseData.extracted?.dimensions || '',
        capacity: baseData.extracted?.capacity || '',
        colors: joinLines(baseData.extracted?.colors),
        packaging: baseData.extracted?.packaging || '',
        target_moq: baseData.target_moq ?? product.moq ?? '',
        requested_customization: baseData.requested_customization || product.customOptions || '',

        main_image_url: baseData.main_image_url || '',
        online_store_status: baseData.online_store_status === 'N' ? 'N' : 'Y',
        categoryMain: initialCategory.main,
        categorySub: initialCategory.sub
      });
      const [isSaving, setIsSaving] = useState(false);
      const [message, setMessage] = useState('');
      const [error, setError] = useState('');

      const updateField = (field, value) => setFormData(prev => ({ ...prev, [field]: value }));
      const handleCategoryMain = (main) => {
        setFormData(prev => ({ ...prev, categoryMain: main, categorySub: categoryTree[main]?.[0] || '' }));
      };

      const handleSave = async () => {
        if (!formData.title_zh.trim() && !formData.title_en.trim()) {
          return setError('中文或英文商品名稱至少要填寫一個。');
        }
        if (!formData.product_handle.trim()) {
          return setError('商品編號不可留白。');
        }
        if (formData.main_image_url.trim() && !/^https?:\/\/\S+$/i.test(formData.main_image_url.trim())) {
          return setError('商品主圖網址需為完整的 http:// 或 https:// 網址，且不能包含空格。');
        }

        setIsSaving(true);
        setError('');
        setMessage('');

        try {
          const currentData = getWorkingData(product);
          const finalData = {
            ...currentData,
            title_zh: formData.title_zh.trim(),
            title_en: formData.title_en.trim(),
            description_zh: formData.description_zh.trim(),
            description_en: formData.description_en.trim(),
            product_highlights_zh: splitLines(formData.highlights_zh),
            product_highlights_en: splitLines(formData.highlights_en),
            seo_title_zh: formData.seo_title_zh.trim(),
            seo_title_en: formData.seo_title_en.trim(),
            seo_description_zh: formData.seo_description_zh.trim(),
            seo_description_en: formData.seo_description_en.trim(),
            seo_keywords: splitComma(formData.seo_keywords),
            extracted: {
              ...(currentData.extracted || {}),
              material: formData.material.trim(),
              dimensions: formData.dimensions.trim(),
              capacity: formData.capacity.trim(),
              colors: splitLines(formData.colors),
              packaging: formData.packaging.trim()
            },
            category: categoryPath(formData.categoryMain, formData.categorySub),
            target_moq: Number(formData.target_moq) || 0,
            requested_customization: formData.requested_customization.trim(),
            product_handle: formData.product_handle.trim(),
            main_image_url: formData.main_image_url.trim(),
            online_store_status: formData.online_store_status
          };

          await db.collection('products').doc(product.id).update({
            aiDraft: cloneData(product.aiDraft || product.aiResult || {}),
            finalData,
            catalogStatus: 'draft',
            categoryMain: formData.categoryMain,
            categorySub: formData.categorySub,
            categoryPath: categoryPath(formData.categoryMain, formData.categorySub),
            productHandle: formData.product_handle.trim(),
            moq: Number(formData.target_moq) || 0,
            customOptions: formData.requested_customization.trim(),
            savedBy: {
              uid: auth.currentUser?.uid || '',
              email: auth.currentUser?.email || ''
            },
            savedAt: product.savedAt || serverTimestamp(),
            updatedAt: serverTimestamp()
          });

          setMessage('✅ 商品資料已儲存。重新整理或離開後再回來，內容仍會保留。');
        } catch (saveError) {
          setError(`儲存失敗：${saveError.message}`);
        } finally {
          setIsSaving(false);
        }
      };

      const fieldClass = "w-full p-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none";
      const labelClass = "block text-xs font-bold text-gray-500 mb-1";

      return (

          <div className="flex items-center justify-between mb-6">
            <div className="flex items-center gap-3">
              <button onClick={onBack} className="p-2 rounded-lg border border-gray-200 bg-white hover:bg-gray-50"><ArrowLeft className="w-5 h-5"/></button>
              <div>
                <h2 className="text-2xl font-bold text-gray-800">編輯商品</h2>
                <p className="text-xs text-gray-400 mt-1">Firestore ID：{product.id}</p>
              </div>

            <button onClick={handleSave} disabled={isSaving} className="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white rounded-lg font-bold flex items-center gap-2">

          {message && <div className="mb-4 p-3 bg-green-50 text-green-700 rounded-lg text-sm">{message}</div>}

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <section className="bg-white border border-gray-200 rounded-xl p-5 space-y-4 shadow-sm">
              <h3 className="font-bold text-gray-800 border-b pb-3">基本資料與分類</h3>
              <div><label className={labelClass}>商品名稱（繁中）</label><input className={fieldClass} value={formData.title_zh} onChange={e => updateField('title_zh', e.target.value)}/></div>
              <div><label className={labelClass}>商品名稱（英文）</label><input className={fieldClass} value={formData.title_en} onChange={e => updateField('title_en', e.target.value)}/></div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className={labelClass}>主分類</label><select className={fieldClass} value={formData.categoryMain} onChange={e => handleCategoryMain(e.target.value)}>{Object.keys(categoryTree).map(item => <option key={item}>{item}</option>)}</select></div>
                <div><label className={labelClass}>次分類</label><select className={fieldClass} value={formData.categorySub} onChange={e => updateField('categorySub', e.target.value)} disabled={!categoryTree[formData.categoryMain]?.length}>{categoryTree[formData.categoryMain]?.map(item => <option key={item}>{item}</option>) || <option value="">無次分類</option>}</select></div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className={labelClass}>目標 MOQ</label><input type="number" className={fieldClass} value={formData.target_moq} onChange={e => updateField('target_moq', e.target.value)}/></div>
                <div><label className={labelClass}>客製工藝</label><input className={fieldClass} value={formData.requested_customization} onChange={e => updateField('requested_customization', e.target.value)}/></div>
              </div>
            </section>

            <section className="bg-white border border-gray-200 rounded-xl p-5 space-y-4 shadow-sm">
              <h3 className="font-bold text-gray-800 border-b pb-3">規格資料</h3>
              <div className="grid grid-cols-2 gap-3">
                <div><label className={labelClass}>材質</label><input className={fieldClass} value={formData.material} onChange={e => updateField('material', e.target.value)}/></div>
                <div><label className={labelClass}>容量</label><input className={fieldClass} value={formData.capacity} onChange={e => updateField('capacity', e.target.value)}/></div>
              </div>
              <div><label className={labelClass}>尺寸</label><input className={fieldClass} value={formData.dimensions} onChange={e => updateField('dimensions', e.target.value)}/></div>
              <div><label className={labelClass}>顏色（每行一個）</label><textarea className={`${fieldClass} min-h-[90px]`} value={formData.colors} onChange={e => updateField('colors', e.target.value)}/></div>
              <div><label className={labelClass}>包裝</label><input className={fieldClass} value={formData.packaging} onChange={e => updateField('packaging', e.target.value)}/></div>
            </section>

            <section className="bg-white border border-gray-200 rounded-xl p-5 space-y-4 shadow-sm lg:col-span-2">
              <div className="border-b pb-3">
                <h3 className="font-bold text-gray-800">SHOPLINE 發布資料</h3>
                <p className="text-xs text-gray-400 mt-1">商品編號由 ERP 自動產生；主圖網址未填時可保存，但會阻擋批次匯出。</p>
              </div>
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                <div><label className={labelClass}>商品編號（Product Handle）</label><input className={fieldClass} value={formData.product_handle} onChange={e => updateField('product_handle', e.target.value)}/></div>
                <div className="lg:col-span-2"><label className={labelClass}>商品主圖網址（必填後才能匯出）</label><input type="url" className={fieldClass} value={formData.main_image_url} onChange={e => updateField('main_image_url', e.target.value)} placeholder="https://..."/></div>
                <div><label className={labelClass}>網店上架狀態</label><select className={fieldClass} value={formData.online_store_status} onChange={e => updateField('online_store_status', e.target.value)}><option value="Y">Y－上架</option><option value="N">N－下架草稿</option></select></div>
                <div className="lg:col-span-2 flex items-end"><p className="text-xs text-gray-500 bg-gray-50 rounded-lg px-3 py-2.5 w-full">價格、特價、成本、庫存、重量與 SKU 在第一版匯出時全部留白。</p></div>
              </div>
            </section>

            <section className="bg-white border border-gray-200 rounded-xl p-5 space-y-4 shadow-sm lg:col-span-2">
              <h3 className="font-bold text-gray-800 border-b pb-3">商品文案</h3>
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div><label className={labelClass}>商品特色（繁中，每行一點）</label><textarea className={`${fieldClass} min-h-[130px]`} value={formData.highlights_zh} onChange={e => updateField('highlights_zh', e.target.value)}/></div>
                <div><label className={labelClass}>Product Highlights（每行一點）</label><textarea className={`${fieldClass} min-h-[130px]`} value={formData.highlights_en} onChange={e => updateField('highlights_en', e.target.value)}/></div>
                <div><label className={labelClass}>商品描述（繁中）</label><textarea className={`${fieldClass} min-h-[180px]`} value={formData.description_zh} onChange={e => updateField('description_zh', e.target.value)}/></div>
                <div><label className={labelClass}>Product Description</label><textarea className={`${fieldClass} min-h-[180px]`} value={formData.description_en} onChange={e => updateField('description_en', e.target.value)}/></div>
              </div>
            </section>

            <section className="bg-white border border-gray-200 rounded-xl p-5 space-y-4 shadow-sm lg:col-span-2">
              <h3 className="font-bold text-gray-800 border-b pb-3">SEO</h3>
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div><label className={labelClass}>SEO 標題（繁中）</label><input className={fieldClass} value={formData.seo_title_zh} onChange={e => updateField('seo_title_zh', e.target.value)}/></div>
                <div><label className={labelClass}>SEO Title</label><input className={fieldClass} value={formData.seo_title_en} onChange={e => updateField('seo_title_en', e.target.value)}/></div>
                <div><label className={labelClass}>SEO 簡介（繁中）</label><textarea className={fieldClass} value={formData.seo_description_zh} onChange={e => updateField('seo_description_zh', e.target.value)}/></div>
                <div><label className={labelClass}>SEO Description</label><textarea className={fieldClass} value={formData.seo_description_en} onChange={e => updateField('seo_description_en', e.target.value)}/></div>
                <div className="lg:col-span-2"><label className={labelClass}>SEO 關鍵字（逗號分隔）</label><input className={fieldClass} value={formData.seo_keywords} onChange={e => updateField('seo_keywords', e.target.value)}/></div>
              </div>
            </section>
          </div>

          {(baseData.missing_fields?.length > 0 || baseData.conflicts?.length > 0) && (
            <section className="mt-6 bg-amber-50 border border-amber-200 rounded-xl p-5">
              <h3 className="font-bold text-amber-800 mb-3">AI 提醒</h3>
              {baseData.missing_fields?.length > 0 && <p className="text-sm text-amber-800 mb-2">缺少資料：{baseData.missing_fields.join('、')}</p>}
              {baseData.conflicts?.length > 0 && <p className="text-sm text-red-700">資料衝突：{baseData.conflicts.join('、')}</p>}
            </section>
          )}
        </div>
      );
    };

    const ProductLibraryView = () => {
      const [products, setProducts] = useState([]);
      const [selectedProductId, setSelectedProductId] = useState('');
      const [selectedIds, setSelectedIds] = useState([]);
      const [searchText, setSearchText] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [isLoading, setIsLoading] = useState(true);
      const [error, setError] = useState('');
      const [exportError, setExportError] = useState('');
      const [exportMessage, setExportMessage] = useState('');

      useEffect(() => {
        const unsubscribe = db.collection('products')
          .orderBy('updatedAt', 'desc')
          .limit(100)
          .onSnapshot((snapshot) => {
            setProducts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            setIsLoading(false);
          }, (snapshotError) => {
            console.error('商品庫載入失敗:', snapshotError);
            setError(`商品庫載入失敗：${snapshotError.message}`);
            setIsLoading(false);
          });

        return () => unsubscribe();
      }, []);

      useEffect(() => {
        const availableIds = new Set(products.map(product => product.id));
        setSelectedIds(previous => previous.filter(id => availableIds.has(id)));
      }, [products]);

      const selectedProduct = products.find(product => product.id === selectedProductId);
      if (selectedProduct) {
        return <ProductEditor product={selectedProduct} onBack={() => setSelectedProductId('')} />;
      }

      const normalizedSearch = searchText.trim().toLowerCase();
      const filteredProducts = products.filter(product => {
        const data = getWorkingData(product);
        const state = getProductState(product);
        const matchesStatus = statusFilter === 'all' || state.key === statusFilter;
        const haystack = [
          data.title_zh,
          data.title_en,
          product.categoryPath,
          data.category,
          product.id
        ].filter(Boolean).join(' ').toLowerCase();
        return matchesStatus && (!normalizedSearch || haystack.includes(normalizedSearch));
      });

      const selectableFilteredIds = filteredProducts.filter(product => product.finalData).map(product => product.id);
      const selectedSet = new Set(selectedIds);
      const allFilteredSelected = selectableFilteredIds.length > 0 && selectableFilteredIds.every(id => selectedSet.has(id));

      const toggleSelection = (productId) => {
        setExportError('');
        setExportMessage('');
        setSelectedIds(previous => previous.includes(productId)
          ? previous.filter(id => id !== productId)
          : [...previous, productId]);
      };

      const toggleSelectAll = () => {
        setExportError('');
        setExportMessage('');
        if (allFilteredSelected) {
          setSelectedIds(previous => previous.filter(id => !selectableFilteredIds.includes(id)));
        } else {
          setSelectedIds(previous => Array.from(new Set([...previous, ...selectableFilteredIds])));
        }
      };

      const getValidatedSelection = () => {
        const selectedProducts = products.filter(product => selectedSet.has(product.id));
        if (selectedProducts.length === 0) {
          setExportError('請先勾選至少一筆已儲存的商品。');
          return null;
        }

        const errorLines = [];
        const handleCounts = {};
        selectedProducts.forEach(product => {
          const handle = buildProductHandle(product);
          if (handle) handleCounts[handle] = (handleCounts[handle] || 0) + 1;
          const issues = getExportIssues(product);
          if (issues.length > 0) {
            const data = getWorkingData(product);
            errorLines.push(`${data.title_zh || data.title_en || product.id}：${issues.join('、')}`);
          }
        });

        Object.entries(handleCounts).forEach(([handle, count]) => {
          if (count > 1) errorLines.push(`商品編號 ${handle} 重複 ${count} 次`);
        });

        if (errorLines.length > 0) {
          setExportError(`有 ${errorLines.length} 項資料尚未符合匯出條件：\n${errorLines.slice(0, 10).join('\n')}${errorLines.length > 10 ? '\n其餘項目請逐筆檢查。' : ''}`);
          return null;
        }

        return selectedProducts;
      };

      const handleExport = (format) => {
        setExportError('');
        setExportMessage('');
        const selectedProducts = getValidatedSelection();
        if (!selectedProducts) return;

        const rows = [shoplineHeadersEn, shoplineHeadersZh, ...selectedProducts.map(buildShoplineRow)];
        if (format === 'csv') {
          const csv = '\uFEFF' + rows.map(row => row.map(csvCell).join(',')).join('\r\n');
          downloadBlob(csv, exportFilename('csv'), 'text/csv;charset=utf-8');
        } else {
          if (!window.XLSX) {
            setExportError('Excel 匯出元件尚未載入，請重新整理頁面後再試。');
            return;
          }
          const worksheet = window.XLSX.utils.aoa_to_sheet(rows);
          worksheet['!cols'] = shoplineHeadersEn.map((_, index) => ({
            wch: index === 18 ? 42 : index <= 21 ? 24 : 16
          }));
          const workbook = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(workbook, worksheet, 'Bulk Import Products');
          window.XLSX.writeFile(workbook, exportFilename('xlsx'), { bookType: 'xlsx', compression: true });
        }

        setExportMessage(`✅ 已匯出 ${selectedProducts.length} 筆商品。`);
      };

      return (
        <div className="p-8 max-w-[1500px] mx-auto animate-in fade-in duration-200">
          <div className="flex items-end justify-between mb-6">
            <div>
              <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2"><Package className="w-6 h-6 text-blue-600"/> 商品庫</h2>
              <p className="text-gray-500 text-sm mt-1">瀏覽 AI 草稿、確認後商品與人工編輯版本。</p>
            </div>
            <div className="text-sm text-gray-500">共 {filteredProducts.length} 筆</div>
          </div>

          <div className="bg-white border border-gray-200 rounded-xl p-4 mb-5 flex flex-col md:flex-row gap-3 shadow-sm">
            <div className="relative flex-1">
              <Search className="w-4 h-4 absolute left-3 top-3 text-gray-400"/>
              <input value={searchText} onChange={e => setSearchText(e.target.value)} className="w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="搜尋商品名稱、分類或 Firestore ID"/>
            </div>
            <div className="relative">
              <Filter className="w-4 h-4 absolute left-3 top-3 text-gray-400"/>
              <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="pl-9 pr-8 py-2.5 border border-gray-200 rounded-lg text-sm bg-white">
                <option value="all">全部狀態</option>
                <option value="processing">處理中</option>
                <option value="review">待確認</option>
                <option value="saved">已儲存</option>
                <option value="error">處理失敗</option>
              </select>
            </div>
          </div>

          <div className="bg-white border border-gray-200 rounded-xl p-4 mb-5 flex flex-col lg:flex-row lg:items-center justify-between gap-3 shadow-sm">
            <div>
              <div className="font-bold text-gray-800">已選取 {selectedIds.length} 筆商品</div>
              <div className="text-xs text-gray-500 mt-1">僅勾選已儲存商品；匯出前會檢查名稱、分類、商品編號與主圖網址。</div>
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={toggleSelectAll} disabled={selectableFilteredIds.length === 0} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 disabled:opacity-40">
                {allFilteredSelected ? <CheckSquare className="w-4 h-4 text-blue-600"/> : <Square className="w-4 h-4"/>}
                {allFilteredSelected ? '取消全選' : '全選篩選結果'}
              </button>
              <button onClick={() => handleExport('csv')} disabled={selectedIds.length === 0} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border border-green-200 bg-green-50 text-green-700 hover:bg-green-100 disabled:opacity-40">
                <FileText className="w-4 h-4"/> 下載 CSV
              </button>
              <button onClick={() => handleExport('xlsx')} disabled={selectedIds.length === 0} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-blue-600 text-white hover:bg-blue-700 disabled:bg-gray-300">
                <Download className="w-4 h-4"/> 匯出 SHOPLINE Excel
              </button>
            </div>
          </div>

          {error && <div className="mb-4 p-3 bg-red-50 text-red-700 rounded-lg text-sm">{error}</div>}
          {exportError && <div className="mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm whitespace-pre-line">{exportError}</div>}
          {exportMessage && <div className="mb-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm">{exportMessage}</div>}

          <div className="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
            {isLoading ? (
              <div className="py-20 flex justify-center text-gray-400"><Loader2 className="w-7 h-7 animate-spin"/></div>
            ) : filteredProducts.length === 0 ? (
              <div className="py-20 text-center text-gray-400"><Package className="w-12 h-12 mx-auto mb-3 opacity-30"/><p>目前沒有符合條件的商品</p></div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead className="bg-gray-50 text-gray-500 text-left">
                    <tr>
                      <th className="px-4 py-3 font-medium w-12">
                        <button onClick={toggleSelectAll} disabled={selectableFilteredIds.length === 0} title="全選目前篩選結果" className="p-1 disabled:opacity-30">
                          {allFilteredSelected ? <CheckSquare className="w-5 h-5 text-blue-600"/> : <Square className="w-5 h-5"/>}
                        </button>
                      </th>
                      <th className="px-5 py-3 font-medium">商品名稱</th>
                      <th className="px-5 py-3 font-medium">分類</th>
                      <th className="px-5 py-3 font-medium">MOQ</th>
                      <th className="px-5 py-3 font-medium">狀態</th>
                      <th className="px-5 py-3 font-medium">匯出檢查</th>
                      <th className="px-5 py-3 font-medium">更新時間</th>
                      <th className="px-5 py-3 font-medium text-right">操作</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {filteredProducts.map(product => {
                      const data = getWorkingData(product);
                      const state = getProductState(product);
                      const exportIssues = getExportIssues(product);
                      const canSelect = Boolean(product.finalData);
                      const isSelected = selectedSet.has(product.id);
                      return (
                        <tr key={product.id} className="hover:bg-gray-50">
                          <td className="px-4 py-4">
                            <button onClick={() => toggleSelection(product.id)} disabled={!canSelect} title={canSelect ? '選取商品' : '請先保存商品'} className="p-1 disabled:opacity-25 disabled:cursor-not-allowed">
                              {isSelected ? <CheckSquare className="w-5 h-5 text-blue-600"/> : <Square className="w-5 h-5 text-gray-400"/>}
                            </button>
                          </td>
                          <td className="px-5 py-4">
                            <div className="font-bold text-gray-800">{data.title_zh || data.title_en || '等待 AI 產生名稱'}</div>
                            <div className="text-xs text-gray-400 mt-1">{product.id}</div>
                          </td>
                          <td className="px-5 py-4 text-gray-600">{product.categoryPath || data.category || '—'}</td>
                          <td className="px-5 py-4 text-gray-600">{data.target_moq || product.moq || '—'}</td>
                          <td className="px-5 py-4"><span className={`px-2.5 py-1 rounded-full text-xs font-medium ${state.className}`}>{state.label}</span></td>
                          <td className="px-5 py-4">
                            {exportIssues.length === 0
                              ? <span className="inline-flex items-center gap-1 text-xs font-medium text-green-700"><CheckCircle2 className="w-4 h-4"/> 可匯出</span>
                              : <span title={exportIssues.join('、')} className="inline-flex items-center gap-1 text-xs font-medium text-amber-700"><AlertCircle className="w-4 h-4"/> 缺 {exportIssues.length} 項</span>}
                          </td>
                          <td className="px-5 py-4 text-gray-500 whitespace-nowrap">{formatDate(product.updatedAt || product.createdAt)}</td>
                          <td className="px-5 py-4 text-right">
                            <button onClick={() => setSelectedProductId(product.id)} disabled={!product.aiResult && !product.finalData} className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">
                              <Edit3 className="w-4 h-4"/> 編輯
                            </button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    };

    function App() {
      // ✅ 將 isLoggedIn 初始值設為 null，代表正在驗證中
      const [isLoggedIn, setIsLoggedIn] = useState(null); 
      const [activeTab, setActiveTab] = useState('ai-import');
      const [currentUser, setCurrentUser] = useState(null);

      // ✅ 監聽 Firebase 的登入狀態，解決重新整理跳回登入頁的問題
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((user) => {
          if (user) {
            setIsLoggedIn(true);
            setCurrentUser(user);
          } else {
            setIsLoggedIn(false);
            setCurrentUser(null);
          }
        });
        return () => unsubscribe();
      }, []);

      // 執行登出
      const handleLogout = () => {
        auth.signOut();
      };

      // ✅ 在驗證結果出來前，顯示載入畫面避免閃爍
      if (isLoggedIn === null) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-gray-50">
            <Loader2 className="w-12 h-12 text-blue-500 animate-spin mb-4" />
            <p className="text-gray-500 font-medium">系統安全驗證中...</p>
          </div>
        );
      }

      if (!isLoggedIn) {
        return <SimpleLogin />;
      }

      return (
        <div className="flex min-h-screen bg-gray-50 font-sans">
          <div className="bg-gray-900 text-white w-64 min-h-screen flex flex-col shrink-0">
            <div className="p-6 border-b border-gray-800"><h1 className="text-2xl font-bold tracking-wider">PEYSON<span className="text-blue-500">.ERP</span></h1></div>
            <nav className="flex-1 py-4 flex flex-col justify-between">
              <div>
                <button onClick={() => setActiveTab('ai-import')} className={`w-full flex items-center py-3 px-6 gap-3 text-sm transition-colors ${activeTab === 'ai-import' ? 'bg-blue-600 text-white border-r-4 border-blue-400' : 'text-gray-400'}`}><Wand2 className="w-5 h-5 shrink-0" /> AI 流水線</button>
                <button onClick={() => setActiveTab('products')} className={`w-full flex items-center py-3 px-6 gap-3 text-sm transition-colors ${activeTab === 'products' ? 'bg-blue-600 text-white border-r-4 border-blue-400' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}><Package className="w-5 h-5 shrink-0" /> 商品庫</button>
              </div>
              
              {/* 登出按鈕 */}
              <div className="px-4 pb-4">
                <button onClick={handleLogout} className="w-full flex items-center justify-center py-2.5 px-4 gap-2 text-sm text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg transition-colors">
                  <LogOut className="w-4 h-4" /> 登出系統
                </button>
              </div>
            </nav>
          </div>
          <main className="flex-1 overflow-y-auto relative">
            {activeTab === 'ai-import' && <AIImportView onOpenLibrary={() => setActiveTab('products')} />}
            {activeTab === 'products' && <ProductLibraryView />}
          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
