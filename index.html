                        <div><label className="block text-xs font-bold text-gray-500 mb-1">商品名稱</label><input type="text" value={aiResult.title_zh || ''} onChange={e => handlePreviewChange('title_zh', e.target.value)} className="w-full p-2 border border-gray-200 rounded text-sm font-bold text-gray-900" /></div>
                        <div><label className="block text-xs font-bold text-gray-500 mb-1">詳細描述</label><textarea value={aiResult.description_zh || ''} onChange={e => handlePreviewChange('description_zh', e.target.value)} className="w-full p-3 border border-gray-200 rounded text-sm min-h-[150px]" /></div>
                      </div>
                    </div>
                 )}
               </div>
               <div className="p-6 bg-white border-t border-gray-200 absolute bottom-0 left-0 right-0">
                  <button onClick={handleSave} disabled={!aiResult || isSaving} className={`w-full py-4 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg transition-all text-lg ${!aiResult ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-green-600 hover:bg-green-500 text-white'}`}>
                    <Save className="w-6 h-6"/> 確認無誤，保存至商品庫
                  </button>
                  {aiResult && (
                    <button onClick={onOpenLibrary} className="w-full mt-2 text-sm text-blue-600 hover:text-blue-800 font-medium">
                      前往商品庫瀏覽與編輯
                    </button>
                  )}
               </div>
            </div>
          </div>
        </div>
      );
    };

    const ProductEditor = ({ product, onBack, categoryCatalog, tagCatalog }) => {
      const normalizedTags = normalizeProductTags(tagCatalog);
      const baseData = getWorkingData(product);
      const parsedCategory = getCategoryParts(product, baseData, categoryCatalog);
      const editorCategoryTree = buildCategoryTree(categoryCatalog);
      if (isValidCategory(parsedCategory.main, parsedCategory.sub, categoryCatalog)) {
        if (!editorCategoryTree[parsedCategory.main]) editorCategoryTree[parsedCategory.main] = [];
        if (parsedCategory.sub && !editorCategoryTree[parsedCategory.main].includes(parsedCategory.sub)) {
          editorCategoryTree[parsedCategory.main].push(parsedCategory.sub);
        }
      }
      const fallbackMain = Object.keys(editorCategoryTree)[0] || '';
      const initialCategory = isValidCategory(parsedCategory.main, parsedCategory.sub, categoryCatalog)
        ? parsedCategory
        : { main: fallbackMain, sub: editorCategoryTree[fallbackMain]?.[0] || '' };
      const initialTagSelection = getProductTagSelection(product, normalizedTags);
      const initialTagNames = getSelectedTagNames(normalizedTags, initialTagSelection.ids, initialTagSelection.fallbackNames);
      const initialCrafts = getTagNamesByGroup(normalizedTags, initialTagSelection.ids, '工藝');
      const initialOnsiteCustomization = initialTagNames.includes('現場客製')
        ? 'Y'
        : (baseData.onsite_customization || product.onsiteCustomization || 'N');
      const [formData, setFormData] = useState({
        title_zh: baseData.title_zh || '',
        title_en: baseData.title_en || '',
        description_zh: stripOnsiteCopy(baseData.description_zh, 'zh'),
        description_en: stripOnsiteCopy(baseData.description_en, 'en'),
        highlights_zh: joinLines(applyCustomizationHighlights(baseData.product_highlights_zh, initialCrafts, initialOnsiteCustomization, 'zh', normalizedTags)),
        highlights_en: joinLines(applyCustomizationHighlights(baseData.product_highlights_en, initialCrafts, initialOnsiteCustomization, 'en', normalizedTags)),
        seo_title_zh: baseData.seo_title_zh || '',
        seo_title_en: baseData.seo_title_en || '',
        seo_description_zh: baseData.seo_description_zh || '',
        seo_description_en: baseData.seo_description_en || '',
        seo_keywords: Array.isArray(baseData.seo_keywords) ? baseData.seo_keywords.join(', ') : '',
        source_url: baseData.source_url || product.sourceUrl || '',
        material: getProductMaterial(product),
        dimensions: baseData.extracted?.dimensions || '',
        capacity: baseData.extracted?.capacity || '',
        weight: baseData.extracted?.weight || '',
        colors: joinLines(baseData.extracted?.colors),
        target_moq: baseData.target_moq ?? product.moq ?? '',
        product_tag_ids: initialTagSelection.ids,
        product_tag_fallback_names: initialTagSelection.fallbackNames,
        customization_crafts: initialCrafts,
        onsite_customization: initialOnsiteCustomization,
        product_handle: buildProductHandle(product),
        main_image_urls: (() => {
          const urls = normalizeUrlList(baseData.main_image_urls, baseData.main_image_url, MAX_MAIN_IMAGES);
          return urls.length > 0 ? urls : [''];
        })(),
        additional_image_urls: (() => {
          const urls = normalizeUrlList(baseData.additional_image_urls, baseData.additional_images, MAX_ADDITIONAL_IMAGES);
          return urls.length > 0 ? urls : [''];
        })(),
        online_store_status: baseData.online_store_status === 'N' ? 'N' : 'Y',
        categoryMain: initialCategory.main,
        categorySub: initialCategory.sub
      });
      const [isSaving, setIsSaving] = useState(false);
      const [isSyncingContent, setIsSyncingContent] = useState(false);
      const [isSyncingEnglish, setIsSyncingEnglish] = useState(false);
      const [message, setMessage] = useState('');
      const [error, setError] = useState('');

      useEffect(() => {
        setFormData(previous => {
          const nextTagIds = previous.product_tag_ids.filter(id => Boolean(findTagRecord(normalizedTags, id)));
          const nextTagNames = getSelectedTagNames(normalizedTags, nextTagIds, previous.product_tag_fallback_names);
          const nextCrafts = getTagNamesByGroup(normalizedTags, nextTagIds, '工藝');
          const nextOnsite = nextTagNames.includes('現場客製') ? 'Y' : 'N';
          const craftsUnchanged = nextCrafts.length === previous.customization_crafts.length
            && nextCrafts.every((craft, index) => craft === previous.customization_crafts[index]);
          const tagsUnchanged = nextTagIds.length === previous.product_tag_ids.length
            && nextTagIds.every((id, index) => id === previous.product_tag_ids[index]);
          if (craftsUnchanged && tagsUnchanged && nextOnsite === previous.onsite_customization) return previous;
          return {
            ...previous,
            product_tag_ids: nextTagIds,
            customization_crafts: nextCrafts,
            onsite_customization: nextOnsite,
            highlights_zh: joinLines(applyCustomizationHighlights(previous.highlights_zh, nextCrafts, nextOnsite, 'zh', normalizedTags)),
            highlights_en: joinLines(applyCustomizationHighlights(previous.highlights_en, nextCrafts, nextOnsite, 'en', normalizedTags))
          };
        });
      }, [tagCatalog]);

      const selectedProductTagNames = getSelectedTagNames(
        normalizedTags,
        formData.product_tag_ids,
        formData.product_tag_fallback_names
      );

      const previewFinalData = {
        ...getWorkingData(product),
        title_zh: formData.title_zh.trim(),
        title_en: formData.title_en.trim(),
        product_highlights_zh: applyCustomizationHighlights(
          formData.highlights_zh,
          formData.customization_crafts,
          formData.onsite_customization,
          'zh',
          normalizedTags
        ),
        product_highlights_en: applyCustomizationHighlights(
          formData.highlights_en,
          formData.customization_crafts,
          formData.onsite_customization,
          'en',
          normalizedTags
        ),
        category: categoryPath(formData.categoryMain, formData.categorySub, categoryCatalog),
        product_handle: formData.product_handle.trim(),
        main_image_urls: normalizeUrlList(formData.main_image_urls, '', Number.MAX_SAFE_INTEGER),
        additional_image_urls: normalizeUrlList(formData.additional_image_urls, '', Number.MAX_SAFE_INTEGER),
        product_tag_ids: formData.product_tag_ids,
        product_tags: selectedProductTagNames,
        customization_crafts: formData.customization_crafts,
        onsite_customization: formData.onsite_customization
      };
      const previewProduct = {
        ...product,
        finalData: previewFinalData,
        categoryMain: formData.categoryMain,
        categorySub: formData.categorySub,
        productHandle: formData.product_handle.trim(),
        productTagIds: formData.product_tag_ids,
        productTags: selectedProductTagNames,
        customOptionList: formData.customization_crafts,
        onsiteCustomization: formData.onsite_customization
      };
      const previewExportIssues = getExportIssues(previewProduct, categoryCatalog, normalizedTags);
      const previewSummaryZhLength = buildSummary(previewFinalData.product_highlights_zh).length;
      const previewSummaryEnLength = buildSummary(previewFinalData.product_highlights_en).length;

      const updateField = (field, value) => setFormData(prev => ({ ...prev, [field]: value }));
      const toggleEditorTag = (tagId) => {
        setFormData(prev => {
          const nextTagIds = prev.product_tag_ids.includes(tagId)
            ? prev.product_tag_ids.filter(id => id !== tagId)
            : [...prev.product_tag_ids, tagId];
          const nextTagNames = getSelectedTagNames(normalizedTags, nextTagIds, prev.product_tag_fallback_names);
          const nextCrafts = getTagNamesByGroup(normalizedTags, nextTagIds, '工藝');
          const nextOnsite = nextTagNames.includes('現場客製') ? 'Y' : 'N';
          return {
            ...prev,
            product_tag_ids: nextTagIds,
            customization_crafts: nextCrafts,
            onsite_customization: nextOnsite,
            highlights_zh: joinLines(applyCustomizationHighlights(prev.highlights_zh, nextCrafts, nextOnsite, 'zh', normalizedTags)),
            highlights_en: joinLines(applyCustomizationHighlights(prev.highlights_en, nextCrafts, nextOnsite, 'en', normalizedTags))
          };
        });
      };
      const updateImageUrl = (field, index, value) => {
        setFormData(prev => ({
          ...prev,
          [field]: prev[field].map((item, itemIndex) => itemIndex === index ? value : item)
        }));
      };
      const addImageUrlField = (field, maxItems) => {
        setFormData(prev => prev[field].length >= maxItems
          ? prev
          : { ...prev, [field]: [...prev[field], ''] });
      };
      const removeImageUrlField = (field, index) => {
        setFormData(prev => {
          const remaining = prev[field].filter((_, itemIndex) => itemIndex !== index);
          return { ...prev, [field]: remaining.length > 0 ? remaining : [''] };
        });
      };
      const handleCategoryMain = (main) => {
        setFormData(prev => ({ ...prev, categoryMain: main, categorySub: editorCategoryTree[main]?.[0] || '' }));
      };
      const handleContentSync = async () => {
        if (!formData.title_zh.trim()) {
          return setError('請先填寫繁中商品名稱，再執行同步處理。');
        }
        setIsSyncingContent(true);
        setError('');
        setMessage('');

        try {
          const token = await auth.currentUser?.getIdToken();
          if (!token) throw new Error('登入狀態已失效，請重新登入。');

          const response = await fetch(`${BACKEND_URL}/api/sync-product-content`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              title_zh: formData.title_zh.trim(),
              category: categoryPath(formData.categoryMain, formData.categorySub, categoryCatalog),
              target_moq: String(formData.target_moq || '').trim(),
              specifications: {
                material: formData.material.trim(),
                dimensions: formData.dimensions.trim(),
                capacity: formData.capacity.trim(),
                weight: formData.weight.trim(),
                colors: splitLines(formData.colors)
              },
              customization_crafts: formData.customization_crafts,
              onsite_customization: formData.onsite_customization,
              product_tags: selectedProductTagNames,
              current_copy: {
                product_highlights_zh: stripManagedHighlights(formData.highlights_zh, 'zh'),
                description_zh: stripOnsiteCopy(formData.description_zh, 'zh'),
                seo_title_zh: formData.seo_title_zh.trim(),
                seo_description_zh: formData.seo_description_zh.trim(),
                seo_keywords: splitComma(formData.seo_keywords)
              }
            })
          });

          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.error || `同步處理失敗（HTTP ${response.status}）`);

          const synced = payload.result || {};
          setFormData(prev => ({
            ...prev,
            title_en: synced.title_en || '',
            highlights_zh: joinLines(applyCustomizationHighlights(
              synced.product_highlights_zh,
              prev.customization_crafts,
              prev.onsite_customization,
              'zh',
              normalizedTags
            )),
            highlights_en: joinLines(applyCustomizationHighlights(
              synced.product_highlights_en,
              prev.customization_crafts,
              prev.onsite_customization,
              'en',
              normalizedTags
            )),
            description_zh: stripOnsiteCopy(synced.description_zh, 'zh'),
            description_en: stripOnsiteCopy(synced.description_en, 'en'),
            seo_title_zh: synced.seo_title_zh || '',
            seo_title_en: synced.seo_title_en || '',
            seo_description_zh: synced.seo_description_zh || '',
            seo_description_en: synced.seo_description_en || '',
            seo_keywords: Array.isArray(synced.seo_keywords) ? synced.seo_keywords.join(', ') : ''
          }));
          setMessage('✅ 上方最新資料已同步至中英文商品文案與 SEO；請確認預覽後按「儲存修改」。');
        } catch (syncError) {
          setError(`同步處理失敗：${syncError.message}`);
        } finally {
          setIsSyncingContent(false);
        }
      };

      const handleEnglishSync = async () => {
        if (!formData.title_zh.trim() && !formData.description_zh.trim() && !formData.highlights_zh.trim()) {
          return setError('請先填寫繁中商品名稱或商品文案，再執行英文同步。');
        }

        setIsSyncingEnglish(true);
        setError('');
        setMessage('');

        try {
          const token = await auth.currentUser?.getIdToken();
          if (!token) throw new Error('登入狀態已失效，請重新登入。');

          const response = await fetch(`${BACKEND_URL}/api/sync-english`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              title_zh: formData.title_zh.trim(),
              product_highlights_zh: applyCustomizationHighlights(
                formData.highlights_zh,
                formData.customization_crafts,
                formData.onsite_customization,
                'zh',
                normalizedTags
              ),
              description_zh: stripOnsiteCopy(formData.description_zh, 'zh'),
              seo_title_zh: formData.seo_title_zh.trim(),
              seo_description_zh: formData.seo_description_zh.trim()
            })
          });

          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.error || `英文同步失敗（HTTP ${response.status}）`);

          const translated = payload.result || {};
          setFormData(prev => ({
            ...prev,
            title_en: translated.title_en || '',
            highlights_zh: joinLines(applyCustomizationHighlights(
              prev.highlights_zh,
              prev.customization_crafts,
              prev.onsite_customization,
              'zh',
              normalizedTags
            )),
            highlights_en: joinLines(applyCustomizationHighlights(
              translated.product_highlights_en,
              prev.customization_crafts,
              prev.onsite_customization,
              'en',
              normalizedTags
            )),
            description_zh: stripOnsiteCopy(prev.description_zh, 'zh'),
            description_en: stripOnsiteCopy(translated.description_en, 'en'),
            seo_title_en: translated.seo_title_en || '',
            seo_description_en: translated.seo_description_en || ''
          }));
          setMessage('✅ 英文內容已依目前繁中文案同步，請確認後按「儲存修改」。');
        } catch (syncError) {
          setError(`英文同步失敗：${syncError.message}`);
        } finally {
          setIsSyncingEnglish(false);
        }
      };

      const handleSave = async () => {
        if (!formData.title_zh.trim() && !formData.title_en.trim()) {
          return setError('中文或英文商品名稱至少要填寫一個。');
        }
        if (!formData.product_handle.trim()) {
          return setError('商品編號不可留白。');
        }
        const mainImageUrls = normalizeUrlList(formData.main_image_urls, '', Number.MAX_SAFE_INTEGER);
        const additionalImageUrls = normalizeUrlList(formData.additional_image_urls, '', Number.MAX_SAFE_INTEGER);
        if (mainImageUrls.length > MAX_MAIN_IMAGES) return setError(`商品主要圖片最多 ${MAX_MAIN_IMAGES} 張。`);
        if (additionalImageUrls.length > MAX_ADDITIONAL_IMAGES) return setError(`更多圖片最多 ${MAX_ADDITIONAL_IMAGES} 張。`);
        if (mainImageUrls.some(url => !isValidShoplineImageUrl(url))) {
          return setError('商品主要圖片網址須以 https:// 開頭，且不能包含空格或中文字。');
        }
        if (additionalImageUrls.some(url => !isValidShoplineImageUrl(url))) {
          return setError('更多圖片網址須以 https:// 開頭，且不能包含空格或中文字。');
        }

        setIsSaving(true);
        setError('');
        setMessage('');

        try {
          const currentData = getWorkingData(product);
          const finalData = {
            ...currentData,
            title_zh: formData.title_zh.trim(),
            title_en: formData.title_en.trim(),
            description_zh: stripOnsiteCopy(formData.description_zh, 'zh'),
            description_en: stripOnsiteCopy(formData.description_en, 'en'),
            product_highlights_zh: applyCustomizationHighlights(
              formData.highlights_zh,
              formData.customization_crafts,
              formData.onsite_customization,
              'zh',
              normalizedTags
            ),
            product_highlights_en: applyCustomizationHighlights(
              formData.highlights_en,
              formData.customization_crafts,
              formData.onsite_customization,
              'en',
              normalizedTags
            ),
            seo_title_zh: formData.seo_title_zh.trim(),
            seo_title_en: formData.seo_title_en.trim(),
            seo_description_zh: formData.seo_description_zh.trim(),
            seo_description_en: formData.seo_description_en.trim(),
            seo_keywords: splitComma(formData.seo_keywords),
            source_url: formData.source_url.trim(),
            extracted: {
              ...(currentData.extracted || {}),
              material: formData.material.trim(),
              dimensions: formData.dimensions.trim(),
              capacity: formData.capacity.trim(),
              weight: formData.weight.trim(),
              colors: splitLines(formData.colors)
            },
            category: categoryPath(formData.categoryMain, formData.categorySub, categoryCatalog),
            target_moq: Number(formData.target_moq) || 0,
            requested_customization: formData.customization_crafts.join('、'),
            customization_craft: formData.customization_crafts.join('、'),
            customization_crafts: formData.customization_crafts,
            onsite_customization: formData.onsite_customization,
            product_tag_ids: formData.product_tag_ids,
            product_tags: selectedProductTagNames,
            product_handle: formData.product_handle.trim(),
            main_image_url: mainImageUrls[0] || '',

    const ProductLibraryView = ({ defaultStatusFilter = 'all', title = '商品庫', categoryCatalog, tagCatalog }) => {
      const [products, setProducts] = useState([]);
      const [selectedProductId, setSelectedProductId] = useState('');
      const [selectedIds, setSelectedIds] = useState([]);
      const [searchText, setSearchText] = useState('');
      const [statusFilter, setStatusFilter] = useState(defaultStatusFilter);
      const [isLoading, setIsLoading] = useState(true);
      const [error, setError] = useState('');
      const [exportError, setExportError] = useState('');
      const [exportMessage, setExportMessage] = useState('');
      const [actionBusyId, setActionBusyId] = useState('');
      const [isBackingUp, setIsBackingUp] = useState(false);

      useEffect(() => {
        const unsubscribe = db.collection('products')
          .orderBy('updatedAt', 'desc')
          .limit(100)
          .onSnapshot((snapshot) => {
            setProducts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            setIsLoading(false);
          }, (snapshotError) => {
            console.error('商品庫載入失敗:', snapshotError);
            setError(`商品庫載入失敗：${snapshotError.message}`);
            setIsLoading(false);
          });

        return () => unsubscribe();
      }, []);

      useEffect(() => {
        const availableIds = new Set(products.map(product => product.id));
        setSelectedIds(previous => previous.filter(id => availableIds.has(id)));
      }, [products]);

      const selectedProduct = products.find(product => product.id === selectedProductId);
      if (selectedProduct) {
        return <ProductEditor product={selectedProduct} onBack={() => setSelectedProductId('')} categoryCatalog={categoryCatalog} tagCatalog={tagCatalog} />;
      }

      const normalizedSearch = searchText.trim().toLowerCase();
      const filteredProducts = products.filter(product => {
        const data = getWorkingData(product);
        const state = getProductState(product);
        const matchesStatus = statusFilter === 'all' || state.key === statusFilter;
        const haystack = [
          data.title_zh,
          data.title_en,
          product.categoryPath,
          data.category,
          getProductTagNames(product, tagCatalog).join(' '),
          product.id
        ].filter(Boolean).join(' ').toLowerCase();
        return matchesStatus && (!normalizedSearch || haystack.includes(normalizedSearch));
      });

      const selectableFilteredIds = filteredProducts.map(product => product.id);
      const selectedSet = new Set(selectedIds);
      const allFilteredSelected = selectableFilteredIds.length > 0 && selectableFilteredIds.every(id => selectedSet.has(id));
      const selectedProductsForAction = products.filter(product => selectedSet.has(product.id));
      const allSelectedArchived = selectedProductsForAction.length > 0
        && selectedProductsForAction.every(product => product.archived);
      const bulkArchiveLabel = allSelectedArchived ? '解除封存' : '封存';

      const toggleSelection = (productId) => {
        setExportError('');
        setExportMessage('');
        setSelectedIds(previous => previous.includes(productId)
          ? previous.filter(id => id !== productId)
          : [...previous, productId]);
      };

      const toggleSelectAll = () => {
        setExportError('');
        setExportMessage('');
        if (allFilteredSelected) {
          setSelectedIds(previous => previous.filter(id => !selectableFilteredIds.includes(id)));
        } else {
          setSelectedIds(previous => Array.from(new Set([...previous, ...selectableFilteredIds])));
        }
      };

      const handleBulkArchiveToggle = async () => {
        if (selectedProductsForAction.length === 0) {
          return setError('請先勾選至少一筆商品。');
        }
        const unsavedProducts = selectedProductsForAction.filter(product => !product.finalData);
        if (unsavedProducts.length > 0) {
          return setError(`封存僅適用於已儲存商品；目前選取內容有 ${unsavedProducts.length} 筆尚未儲存。`);
        }

        const nextArchived = !allSelectedArchived;
        const actionLabel = nextArchived ? '封存' : '解除封存';
        if (!window.confirm(`確定要一次${actionLabel}所選的 ${selectedProductsForAction.length} 筆商品嗎？`)) return;

        setActionBusyId('bulk-archive');
        setError('');
        try {
          const batch = db.batch();
          selectedProductsForAction.forEach(product => {
            batch.update(db.collection('products').doc(product.id), {
              archived: nextArchived,
              catalogStatus: nextArchived ? 'archived' : 'draft',
              archivedAt: nextArchived ? serverTimestamp() : firebase.firestore.FieldValue.delete(),
              archivedBy: nextArchived
                ? {
                    uid: auth.currentUser?.uid || '',
                    email: auth.currentUser?.email || ''
                  }
                : firebase.firestore.FieldValue.delete(),
              updatedAt: serverTimestamp()
            });
          });
          await batch.commit();
          setSelectedIds([]);
          setExportMessage(`✅ 已${actionLabel} ${selectedProductsForAction.length} 筆商品。`);
        } catch (actionError) {
          setError(`${actionLabel}失敗：${actionError.message}`);
        } finally {
          setActionBusyId('');
        }
      };

      const downloadFullProductBackup = async ({ automatic = false } = {}) => {
        setIsBackingUp(true);
        if (!automatic) {
          setError('');
          setExportError('');
          setExportMessage('');
        }
        try {
          const payload = await downloadFullFirestoreBackup();
          if (!automatic) {
            setExportMessage(`✅ 已備份全部 ${payload.counts.products} 筆商品資料與 ${payload.counts.settings} 份資料管理設定。`);
          }
          return payload;
        } catch (backupError) {
          const message = `完整商品資料備份失敗：${backupError.message}`;
          if (!automatic) setError(message);
          throw new Error(message);
        } finally {
          setIsBackingUp(false);
        }
      };

      const handleBulkDelete = async () => {
        if (selectedProductsForAction.length === 0) {
          return setError('請先勾選至少一筆商品。');
        }
        if (!window.confirm(`確定要永久刪除所選的 ${selectedProductsForAction.length} 筆商品嗎？\n\n系統會先將完整 JSON 備份保存 30 天，備份成功後才執行永久刪除；不會下載到目前電腦，原始上傳圖片也不會一併刪除。`)) return;

        setActionBusyId('bulk-delete');
        setError('');
        try {
          const token = await auth.currentUser?.getIdToken();
          if (!token) throw new Error('登入狀態已失效，請重新登入。');
          const backupResponse = await fetch(`${BACKEND_URL}/api/deletion-backups`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              productIds: selectedProductsForAction.map(product => product.id),
              reason: 'permanent-product-deletion',
              erpVersion: ERP_VERSION
            })
          });
          const backupPayload = await backupResponse.json().catch(() => ({}));
          if (!backupResponse.ok || !backupPayload.ok) {
            throw new Error(backupPayload.error || `刪除前備份失敗（HTTP ${backupResponse.status}）`);
          }
          const batch = db.batch();
          selectedProductsForAction.forEach(product => {
            batch.delete(db.collection('products').doc(product.id));
          });
          await batch.commit();
          setSelectedIds([]);
          const expiresAt = backupPayload.backup?.expiresAt
            ? new Date(backupPayload.backup.expiresAt).toLocaleDateString('zh-TW')
            : '30 天後';
          setExportMessage(`✅ 已永久刪除 ${selectedProductsForAction.length} 筆商品；JSON 備份保留至 ${expiresAt}。`);
        } catch (actionError) {
          setError(`刪除失敗：${actionError.message}`);
        } finally {
          setActionBusyId('');
        }
      };

      const getValidatedSelection = () => {
        const selectedProducts = products.filter(product => selectedSet.has(product.id));
        if (selectedProducts.length === 0) {
          setExportError('請先勾選至少一筆已儲存的商品。');
          return null;
        }

        const errorLines = [];
        const handleCounts = {};
        selectedProducts.forEach(product => {
          const handle = buildProductHandle(product);
          if (handle) handleCounts[handle] = (handleCounts[handle] || 0) + 1;
          const issues = getExportIssues(product, categoryCatalog, tagCatalog);
          if (issues.length > 0) {
            const data = getWorkingData(product);
            errorLines.push(`${data.title_zh || data.title_en || product.id}：${issues.join('、')}`);
          }
        });

        Object.entries(handleCounts).forEach(([handle, count]) => {
          if (count > 1) errorLines.push(`商品編號 ${handle} 重複 ${count} 次`);
        });

        if (errorLines.length > 0) {
          setExportError(`有 ${errorLines.length} 項資料尚未符合匯出條件：\n${errorLines.slice(0, 10).join('\n')}${errorLines.length > 10 ? '\n其餘項目請逐筆檢查。' : ''}`);
          return null;
        }

        return selectedProducts;
      };

      const handleExport = async () => {
        setExportError('');
        setExportMessage('');
        const selectedProducts = getValidatedSelection();
        if (!selectedProducts) return;

        const rows = [shoplineHeadersEn, shoplineHeadersZh, ...selectedProducts.map(product => buildShoplineRow(product, categoryCatalog, tagCatalog))];
        try {
          if (!window.XLSX) {
            setExportError('Excel 匯出元件尚未載入，請重新整理頁面後再試。');
            return;
          }
          const worksheet = window.XLSX.utils.aoa_to_sheet(rows);
          worksheet['!cols'] = shoplineHeadersEn.map((_, index) => ({
            wch: index === 18 ? 42 : index <= 21 ? 24 : 16
          }));
          const workbook = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(workbook, worksheet, 'Bulk Import Products');
          window.XLSX.writeFile(workbook, exportFilename(), { bookType: 'xlsx', compression: true });

          const batch = db.batch();
          selectedProducts.forEach(product => {
            batch.update(db.collection('products').doc(product.id), {
              exportCount: firebase.firestore.FieldValue.increment(1),
              lastExportedAt: serverTimestamp(),
              lastExportedBy: {
                uid: auth.currentUser?.uid || '',
                email: auth.currentUser?.email || ''
              }
            });
          });
          await batch.commit();

          setExportMessage(`✅ 已匯出 ${selectedProducts.length} 筆商品，匯出紀錄已保存。`);
        } catch (exportActionError) {
          setExportError(`Excel 匯出或紀錄保存失敗：${exportActionError.message}`);
        }
      };

      return (
        <div className="p-8 max-w-[1500px] mx-auto animate-in fade-in duration-200">
          <div className="flex items-end justify-between mb-6">
            <div>
              <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2"><Package className="w-6 h-6 text-blue-600"/> {title}</h2>
              <p className="text-gray-500 text-sm mt-1">{defaultStatusFilter === 'archived' ? '集中查看、解除封存或刪除已封存商品。' : '瀏覽 AI 草稿、確認後商品與人工編輯版本。'}</p>
            </div>
            <div className="text-sm text-gray-500">共 {filteredProducts.length} 筆</div>
          </div>

          <div className="bg-white border border-gray-200 rounded-xl p-4 mb-5 flex flex-col md:flex-row gap-3 shadow-sm">
            <div className="relative flex-1">
              <Search className="w-4 h-4 absolute left-3 top-3 text-gray-400"/>
              <input value={searchText} onChange={e => setSearchText(e.target.value)} className="w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="搜尋商品名稱、分類、標籤或 Firestore ID"/>
            </div>
            <div className="relative">
              <Filter className="w-4 h-4 absolute left-3 top-3 text-gray-400"/>
              <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="pl-9 pr-8 py-2.5 border border-gray-200 rounded-lg text-sm bg-white">
                <option value="all">全部狀態</option>
                <option value="processing">處理中</option>
                <option value="review">待確認</option>
                <option value="saved">已儲存</option>
                <option value="archived">已封存</option>
                <option value="error">處理失敗</option>
              </select>
            </div>
          </div>

          <div className="bg-white border border-gray-200 rounded-xl p-4 mb-5 flex flex-col lg:flex-row lg:items-center justify-between gap-3 shadow-sm">
            <div>
              <div className="font-bold text-gray-800">已選取 {selectedIds.length} 筆商品</div>
              <div className="text-xs text-gray-500 mt-1">可批次封存或刪除；匯出前會檢查儲存狀態、名稱、分類、商品編號與主圖網址。</div>
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => downloadFullProductBackup()} disabled={isBackingUp || Boolean(actionBusyId)} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border border-blue-200 text-blue-700 hover:bg-blue-50 disabled:opacity-40">
                {isBackingUp ? <Loader2 className="w-4 h-4 animate-spin"/> : <Download className="w-4 h-4"/>}
                備份全部商品
              </button>
              <button onClick={toggleSelectAll} disabled={selectableFilteredIds.length === 0} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 disabled:opacity-40">
                {allFilteredSelected ? <CheckSquare className="w-4 h-4 text-blue-600"/> : <Square className="w-4 h-4"/>}
                {allFilteredSelected ? '取消全選' : '全選篩選結果'}
              </button>
              <button onClick={handleBulkArchiveToggle} disabled={selectedIds.length === 0 || Boolean(actionBusyId)} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 disabled:opacity-40">
                {allSelectedArchived ? <ArchiveRestore className="w-4 h-4"/> : <Archive className="w-4 h-4"/>}
                {bulkArchiveLabel}
              </button>
              <button onClick={handleBulkDelete} disabled={selectedIds.length === 0 || Boolean(actionBusyId)} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 disabled:opacity-40">
                <Trash2 className="w-4 h-4"/> 刪除
              </button>
              <button onClick={handleExport} disabled={selectedIds.length === 0} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-blue-600 text-white hover:bg-blue-700 disabled:bg-gray-300">
                <Download className="w-4 h-4"/> 匯出 SHOPLINE Excel
              </button>
            </div>
          </div>

          {error && <div className="mb-4 p-3 bg-red-50 text-red-700 rounded-lg text-sm">{error}</div>}
          {exportError && <div className="mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm whitespace-pre-line">{exportError}</div>}
          {exportMessage && <div className="mb-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm">{exportMessage}</div>}

          <div className="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
            {isLoading ? (
              <div className="py-20 flex justify-center text-gray-400"><Loader2 className="w-7 h-7 animate-spin"/></div>
            ) : filteredProducts.length === 0 ? (
              <div className="py-20 text-center text-gray-400"><Package className="w-12 h-12 mx-auto mb-3 opacity-30"/><p>目前沒有符合條件的商品</p></div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead className="bg-gray-50 text-gray-500 text-left">
                    <tr>
                      <th className="px-4 py-3 font-medium w-12">
                        <button onClick={toggleSelectAll} disabled={selectableFilteredIds.length === 0} title="全選目前篩選結果" className="p-1 disabled:opacity-30">
                          {allFilteredSelected ? <CheckSquare className="w-5 h-5 text-blue-600"/> : <Square className="w-5 h-5"/>}
                        </button>
                      </th>
                      <th className="px-5 py-3 font-medium">商品名稱</th>
                      <th className="px-5 py-3 font-medium">分類</th>
                      <th className="px-5 py-3 font-medium">MOQ</th>
                      <th className="px-5 py-3 font-medium">狀態</th>
                      <th className="px-5 py-3 font-medium">匯出檢查</th>
                      <th className="px-5 py-3 font-medium">匯出紀錄</th>
                      <th className="px-5 py-3 font-medium">更新時間</th>
                      <th className="px-5 py-3 font-medium text-right">操作</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {filteredProducts.map(product => {
                      const data = getWorkingData(product);
                      const state = getProductState(product);
                      const exportIssues = getExportIssues(product, categoryCatalog, tagCatalog);
                      const tagNames = getProductTagNames(product, tagCatalog);
                      const isSelected = selectedSet.has(product.id);
                      return (
                        <tr key={product.id} className="hover:bg-gray-50">
                          <td className="px-4 py-4">
                            <button onClick={() => toggleSelection(product.id)} title="選取商品" className="p-1">
                              {isSelected ? <CheckSquare className="w-5 h-5 text-blue-600"/> : <Square className="w-5 h-5 text-gray-400"/>}
                            </button>
                          </td>
                          <td className="px-5 py-4">
                            <div className="font-bold text-gray-800">{data.title_zh || data.title_en || '等待 AI 產生名稱'}</div>
                            {tagNames.length > 0 && (
                              <div className="flex flex-wrap gap-1 mt-1.5">
                                {tagNames.slice(0, 5).map(tag => <span key={tag} className="px-1.5 py-0.5 rounded bg-blue-50 text-blue-700 text-[10px]">{tag}</span>)}
                                {tagNames.length > 5 && <span className="text-[10px] text-gray-400">+{tagNames.length - 5}</span>}
                              </div>
                            )}
                            <div className="text-xs text-gray-400 mt-1">{product.id}</div>
                          </td>
                          <td className="px-5 py-4 text-gray-600">{getShoplineCategory(product, data, categoryCatalog) || '分類待修正'}</td>
                          <td className="px-5 py-4 text-gray-600">{data.target_moq || product.moq || '—'}</td>
                          <td className="px-5 py-4"><span className={`px-2.5 py-1 rounded-full text-xs font-medium ${state.className}`}>{state.label}</span></td>
                          <td className="px-5 py-4">
                            {exportIssues.length === 0
                              ? <span className="inline-flex items-center gap-1 text-xs font-medium text-green-700"><CheckCircle2 className="w-4 h-4"/> 可匯出</span>
                              : (
                                  <div className="max-w-[220px]">
                                    <span className="inline-flex items-center gap-1 text-xs font-medium text-amber-700"><AlertCircle className="w-4 h-4"/> 缺 {exportIssues.length} 項</span>
                                    <div className="text-[11px] leading-4 text-amber-800 mt-1">{exportIssues.join('、')}</div>
                                  </div>
                                )}
                          </td>
                          <td className="px-5 py-4 text-gray-500 whitespace-nowrap">
                            {product.exportCount
                              ? <div>
                                  <div className="text-xs font-medium text-blue-700">已匯出 {product.exportCount} 次</div>
                                  <div className="text-[11px] text-gray-400 mt-1">{formatDate(product.lastExportedAt)}</div>
                                </div>
                              : <span className="text-xs text-gray-400">尚未匯出</span>}
                          </td>
                          <td className="px-5 py-4 text-gray-500 whitespace-nowrap">{formatDate(product.updatedAt || product.createdAt)}</td>
                          <td className="px-5 py-4 text-right">
                            <div className="inline-flex items-center justify-end gap-1.5">
                              <button onClick={() => setSelectedProductId(product.id)} disabled={!product.aiResult && !product.finalData} className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">
                                <Edit3 className="w-4 h-4"/> 編輯
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    };

    function App() {
      // ✅ 將 isLoggedIn 初始值設為 null，代表正在驗證中
      const [isLoggedIn, setIsLoggedIn] = useState(null); 
      const [activeTab, setActiveTab] = useState('ai-import');
      const [expandedGroup, setExpandedGroup] = useState('');
      const [currentUser, setCurrentUser] = useState(null);
      const [categoryCatalog, setCategoryCatalog] = useState(normalizeCategoryCatalog(DEFAULT_CATEGORY_CATALOG));
      const [tagCatalog, setTagCatalog] = useState(normalizeProductTags(DEFAULT_PRODUCT_TAGS));
      const [categorySettingsError, setCategorySettingsError] = useState('');
      const [tagSettingsError, setTagSettingsError] = useState('');

      // ✅ 監聽 Firebase 的登入狀態，解決重新整理跳回登入頁的問題
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((user) => {
          if (user) {
            setIsLoggedIn(true);
            setCurrentUser(user);
          } else {
            setIsLoggedIn(false);
            setCurrentUser(null);
          }
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!isLoggedIn) return undefined;
        const settingsRef = db.collection('settings').doc(CATEGORY_SETTINGS_DOC);
        const unsubscribe = settingsRef.onSnapshot(async (snapshot) => {
          if (snapshot.exists && Array.isArray(snapshot.data().categories)) {
            setCategoryCatalog(normalizeCategoryCatalog(snapshot.data().categories));
            setCategorySettingsError('');
            return;
          }

          try {
            const defaults = normalizeCategoryCatalog(DEFAULT_CATEGORY_CATALOG);
            await settingsRef.set({
              rootName: SHOPLINE_ROOT_CATEGORY,
              categories: defaults,
              schemaVersion: 1,
              createdAt: serverTimestamp(),
              updatedAt: serverTimestamp(),
              updatedBy: {
                uid: auth.currentUser?.uid || '',
                email: auth.currentUser?.email || ''
              }
            }, { merge: true });
            setCategoryCatalog(defaults);
          } catch (seedError) {
            console.error('分類母資料初始化失敗:', seedError);
            setCategorySettingsError(`分類母資料目前使用內建預設值：${seedError.message}`);
          }
        }, (snapshotError) => {
          console.error('分類母資料載入失敗:', snapshotError);
          setCategorySettingsError(`分類母資料載入失敗，目前使用內建預設值：${snapshotError.message}`);
        });
        return () => unsubscribe();
      }, [isLoggedIn]);

      useEffect(() => {
        if (!isLoggedIn) return undefined;
        const settingsRef = db.collection('settings').doc(TAG_SETTINGS_DOC);
        const unsubscribe = settingsRef.onSnapshot(async (snapshot) => {
          if (snapshot.exists && Array.isArray(snapshot.data().groups)) {
            setTagCatalog(normalizeProductTags(snapshot.data()));
            setTagSettingsError('');
            return;
          }

          try {
            const defaults = normalizeProductTags(DEFAULT_PRODUCT_TAGS);
            await settingsRef.set({
              ...defaults,
              schemaVersion: 1,
              createdAt: serverTimestamp(),
              updatedAt: serverTimestamp(),
              updatedBy: {
                uid: auth.currentUser?.uid || '',
                email: auth.currentUser?.email || ''
              }
            }, { merge: true });
            setTagCatalog(defaults);
          } catch (seedError) {
            console.error('商品標籤母資料初始化失敗:', seedError);
            setTagSettingsError(`商品標籤母資料目前使用內建預設值：${seedError.message}`);
          }
        }, (snapshotError) => {
          console.error('商品標籤母資料載入失敗:', snapshotError);
          setTagSettingsError(`商品標籤母資料載入失敗，目前使用內建預設值：${snapshotError.message}`);
        });
        return () => unsubscribe();
      }, [isLoggedIn]);

      const handleSaveCategoryCatalog = async (nextCatalog) => {
        const normalized = normalizeCategoryCatalog(nextCatalog);
        await db.collection('settings').doc(CATEGORY_SETTINGS_DOC).set({
          rootName: SHOPLINE_ROOT_CATEGORY,
          categories: normalized,
          schemaVersion: 1,
          updatedAt: serverTimestamp(),
          updatedBy: {
            uid: auth.currentUser?.uid || '',
            email: auth.currentUser?.email || ''
          }
        }, { merge: true });
        setCategoryCatalog(normalized);
        setCategorySettingsError('');
      };

      const handleSaveTagCatalog = async (nextCatalog) => {
        const normalized = normalizeProductTags(nextCatalog);
        await db.collection('settings').doc(TAG_SETTINGS_DOC).set({
          ...normalized,
          schemaVersion: 1,
          updatedAt: serverTimestamp(),
          updatedBy: {
            uid: auth.currentUser?.uid || '',
            email: auth.currentUser?.email || ''
          }
        }, { merge: true });
        setTagCatalog(normalized);
        setTagSettingsError('');
      };

      // 執行登出
      const handleLogout = () => {
        auth.signOut();
      };

      const navigationGroups = [
        {
          label: '商品中心',
          emoji: '📦',
          items: [
            { id: 'ai-import', label: '商品建置中心' },
            { id: 'products', label: '商品庫' },
            { id: 'archived-products', label: '封存商品' }
          ]
        },
        {
          label: '資料管理',
          emoji: '📁',
          items: [
            { id: 'categories', label: '商品分類' },
            { id: 'tags', label: '商品標籤' },
            { label: '供應商管理', disabled: true }
          ]
        },
        {
          label: '平台管理',
          emoji: '🌐',
          items: [
            { label: 'SHOPLINE', disabled: true },
            { label: 'LINE 禮物', disabled: true }
          ]
        },
        {
          label: '營運管理',
          emoji: '🏢',
          items: [
            { label: '客戶管理', disabled: true },
            { label: '報價管理', disabled: true },
            { label: '訂單管理', disabled: true },
            { label: '庫存管理', disabled: true }
          ]
        },
        {
          label: '系統管理',
          emoji: '⚙',
          items: [
            { label: '操作紀錄', disabled: true },
            { label: '系統設定', disabled: true }
          ]
        }
      ];

      // ✅ 在驗證結果出來前，顯示載入畫面避免閃爍
      if (isLoggedIn === null) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-gray-50">
            <Loader2 className="w-12 h-12 text-blue-500 animate-spin mb-4" />
            <p className="text-gray-500 font-medium">系統安全驗證中...</p>
          </div>
        );
      }

      if (!isLoggedIn) {
        return <SimpleLogin />;
      }

      return (
        <div className="flex min-h-screen bg-gray-50 font-sans">
          <div className="bg-gray-900 text-white w-64 min-h-screen flex flex-col shrink-0">
            <div className="p-6 border-b border-gray-800"><h1 className="text-2xl font-bold tracking-wider">PEYSON<span className="text-blue-500">.ERP</span></h1></div>
            <nav className="flex-1 py-4 px-3 overflow-y-auto space-y-1">
              {navigationGroups.map(group => {
                const isExpanded = expandedGroup === group.label;
                const containsActiveTab = group.items.some(item => item.id === activeTab);
                return (
                  <section key={group.label}>
                    <button
                      type="button"
                      aria-expanded={isExpanded}
                      onClick={() => setExpandedGroup(current => current === group.label ? '' : group.label)}
                      className={`w-full min-h-[44px] flex items-center justify-between rounded-lg py-2.5 px-3 text-left transition-colors ${
                        containsActiveTab
                          ? 'text-white bg-gray-800'
                          : 'text-gray-300 hover:text-white hover:bg-gray-800'
                      }`}
                    >
                      <span className="flex items-center gap-2 text-sm font-bold">
                        <span aria-hidden="true">{group.emoji}</span>
                        <span>{group.label}</span>
                      </span>
                      {isExpanded
                        ? <ChevronDown className="w-4 h-4 text-gray-400" />
                        : <ChevronRight className="w-4 h-4 text-gray-500" />}
                    </button>
                    {isExpanded && (
                      <div className="mt-1 mb-2 ml-3 pl-3 border-l border-gray-700 space-y-1">
                        {group.items.map(item => (
                          <button
                            key={item.id || item.label}
                            type="button"
                            disabled={item.disabled}
                            onClick={() => !item.disabled && setActiveTab(item.id)}
                            className={`w-full min-h-[36px] flex items-center justify-between rounded-lg py-2 px-3 text-left text-sm transition-colors ${
                              item.disabled
                                ? 'text-gray-600 cursor-not-allowed'
                                : activeTab === item.id
                                  ? 'bg-blue-600 text-white'
                                  : 'text-gray-400 hover:text-white hover:bg-gray-800'
                            }`}
                          >
                            <span>{item.label}</span>
                            {item.disabled && <span className="text-[9px] uppercase tracking-wide text-gray-600">Coming Soon</span>}
                          </button>
                        ))}
                      </div>
                    )}
                  </section>
                );
              })}
            </nav>
            <div className="border-t border-gray-800 px-4 py-4">
              <div className="px-2 mb-3">
                <div className="text-xs font-bold text-gray-300">Peyson ERP</div>
                <div className="text-[11px] text-gray-500 mt-0.5">v{ERP_VERSION}</div>
              </div>
              <button onClick={handleLogout} className="w-full flex items-center justify-center py-2.5 px-4 gap-2 text-sm text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg transition-colors">
                <LogOut className="w-4 h-4" /> 登出系統
              </button>
            </div>
          </div>
          <main className="flex-1 overflow-y-auto relative">
            {categorySettingsError && (
              <div className="mx-8 mt-5 p-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-lg text-sm">
                {categorySettingsError}
              </div>
            )}
            {tagSettingsError && (
              <div className="mx-8 mt-3 p-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-lg text-sm">
                {tagSettingsError}
              </div>
            )}
            {activeTab === 'ai-import' && <AIImportView onOpenLibrary={() => setActiveTab('products')} categoryCatalog={categoryCatalog} tagCatalog={tagCatalog} />}
            {activeTab === 'products' && <ProductLibraryView key="products" categoryCatalog={categoryCatalog} tagCatalog={tagCatalog} />}
            {activeTab === 'archived-products' && <ProductLibraryView key="archived-products" defaultStatusFilter="archived" title="封存商品" categoryCatalog={categoryCatalog} tagCatalog={tagCatalog} />}
            {activeTab === 'categories' && <CategoryManagementView catalog={categoryCatalog} onSave={handleSaveCategoryCatalog} />}
            {activeTab === 'tags' && <ProductTagManagementView catalog={tagCatalog} onSave={handleSaveTagCatalog} />}
          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
